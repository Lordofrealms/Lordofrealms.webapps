<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basic PDF Editor</title>
</head>
<body>
<div id="boot" style="font:14px system-ui,sans-serif;padding:20px">Loading PDF Editor…</div>
<script>
(async()=>{
  try{
    const base=new URL('.',location.href);
    const versionUrl=new URL('version.json',base);
    versionUrl.searchParams.set('_',Date.now());
    const meta=await fetch(versionUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('version');return r.json()});
    const v=meta.version||Date.now().toString();
    const names=['app-part-1.txt','app-part-2.txt','app-part-3.txt','app-part-4.txt'];
    const parts=await Promise.all(names.map(name=>{
      const u=new URL(name,base);u.searchParams.set('v',v);
      return fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(name);return r.text()});
    }));
    let app=parts.join('');
    app=app.replace(/v0\.8\.0/g,'v'+v).replace("const APP_VERSION='0.8.0';",`const APP_VERSION='${v}';`);
    const override=`\n// v0.8.1: robust dominant-background sampling for PDF text masks\nsampleMaskColor=function(r){\n  try{\n    const sx=pdfCanvas.width/viewport.width, sy=pdfCanvas.height/viewport.height, W=viewport.width, H=viewport.height;\n    const left=r.x*W, right=(r.x+r.w)*W, top=r.y*H, bottom=(r.y+r.h)*H;\n    const pad=Math.max(3,Math.min(12,(bottom-top)*0.45));\n    const samples=[];\n    const add=(cx,cy)=>{\n      const px=Math.max(0,Math.min(pdfCanvas.width-1,Math.round(cx*sx)));\n      const py=Math.max(0,Math.min(pdfCanvas.height-1,Math.round(cy*sy)));\n      const d=pdfCtx.getImageData(px,py,1,1).data;\n      const rgb=[d[0],d[1],d[2]];\n      const max=Math.max(...rgb), min=Math.min(...rgb), lum=0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];\n      if(lum>=165 && max-min<=75) samples.push(rgb);\n    };\n    const steps=14;\n    for(let i=0;i<=steps;i++){\n      const t=i/steps;\n      const x=left+(right-left)*t, y=top+(bottom-top)*t;\n      add(x,top-pad); add(x,bottom+pad); add(left-pad,y); add(right+pad,y);\n      add(x,top-pad*0.55); add(x,bottom+pad*0.55);\n    }\n    if(!samples.length)return '#ffffff';\n    const buckets=new Map();\n    for(const rgb of samples){\n      const q=rgb.map(v=>Math.max(0,Math.min(255,Math.round(v/12)*12)));\n      const key=q.join(',');\n      const b=buckets.get(key)||{count:0,sum:[0,0,0]};\n      b.count++; b.sum[0]+=rgb[0]; b.sum[1]+=rgb[1]; b.sum[2]+=rgb[2]; buckets.set(key,b);\n    }\n    let best=null;\n    for(const b of buckets.values())if(!best||b.count>best.count)best=b;\n    let rgb=best.sum.map(v=>Math.round(v/best.count));\n    const max=Math.max(...rgb), min=Math.min(...rgb);\n    if(min>=244 && max-min<=12)rgb=[255,255,255];\n    return '#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');\n  }catch(e){return '#ffffff'}\n};\n`;
    const end=app.lastIndexOf('</script>');
    if(end>=0)app=app.slice(0,end)+override+app.slice(end);
    document.open();document.write(app);document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').textContent='Could not load the latest PDF Editor. Refresh the page to try again.';
  }
})();
</script>
</body>
</html>
