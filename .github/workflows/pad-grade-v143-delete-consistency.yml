name: Pad Grade Delete Consistency

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - '.github/workflows/pad-grade-v143-delete-consistency.yml'
  pull_request:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - '.github/workflows/pad-grade-v143-delete-consistency.yml'
  workflow_dispatch:

concurrency:
  group: pad-grade-delete-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project deletion consistency
        run: |
          node --check pad-grade/v143-delete-consistency.js
          node --check pad-grade/v143-delete-consistency-selftest.js
          node --check pad-grade/v096-dev-defaults.js
          node pad-grade/v143-delete-consistency-selftest.js
          grep -F '__padGradeDeleteCaptureV143' pad-grade/v096-dev-defaults.js
          grep -F 'v143-delete-consistency.js?v=20260902-1' pad-grade/index.html
          grep -F "exact-durable-first-local-index-cache-then-double-reconcile" pad-grade/v143-delete-consistency.js
          git diff --check
