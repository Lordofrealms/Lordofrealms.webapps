name: Pad Grade Android

on:
  push:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-android.yml'
  pull_request:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-android.yml'
  workflow_dispatch:

concurrency:
  group: pad-grade-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web scripts
        run: |
          node --check pad-grade/capture-fix.js
          node --check pad-grade/map.js
          node --check pad-grade/map-instance-hook-v064.js
          node --check pad-grade/recovery-visual-v073.js
          node --check pad-grade/v030.js
          node --check pad-grade/v031.js
          node --check pad-grade/v040.js
          node --check pad-grade/v040-sync.js
          node --check pad-grade/v041.js
          node --check pad-grade/v041-persist.js
          node --check pad-grade/v042.js
          node --check pad-grade/v043.js
          node --check pad-grade/v046.js
          node --check pad-grade/v047.js
          node --check pad-grade/v048.js
          node --check pad-grade/v049.js
          node --check pad-grade/v050.js
          node --check pad-grade/v051.js
          node --check pad-grade/v052.js
          node --check pad-grade/v053.js
          node --check pad-grade/v060-dev.js
          node --check pad-grade/v061-dev.js
          node --check pad-grade/v062-dev.js
          node --check pad-grade/v063-dev.js
          node --check pad-grade/v064-dev.js
          node --check pad-grade/v065-dev.js
          node --check pad-grade/v066-dev.js
          node --check pad-grade/v067-dev.js
          node --check pad-grade/v069-dev.js
          node --check pad-grade/v070-dev.js
          node --check pad-grade/v071-dev.js
          node --check pad-grade/v071-map-ui.js
          node --check pad-grade/v072-project-restore.js
          node --check pad-grade/v075-startup.js
          node --check pad-grade/v078-dev.js
          node --check pad-grade/project-compare-core.js
          node --check pad-grade/v081-project-compare.js
          node --check pad-grade/v082-project-compare-fix.js
          node --check pad-grade/v083-project-compare-fix.js
          node --check pad-grade/v085-map-render-order.js
          node --check pad-grade/v086-compare-presentation.js
          node --check pad-grade/v087-compare-back.js
          node --check pad-grade/v088-project-list-layout.js
          node --check pad-grade/v089-imagery-recovery.js
          node --check pad-grade/v090-first-run-guard.js
          node --check pad-grade/v090-project-switch-boundary.js
          node --check pad-grade/heatmap-raster-worker-v073.js
          node --check pad-grade/dev-selftest.js
          node --check pad-grade/migration-core.js
          node --check pad-grade/grid-core.js

      - name: Verify startup, grid, and CanvasSource heatmap gates
        run: |
          grep -F "padGradeHeatmapOptInV061" pad-grade/v062-dev.js
          grep -F "platform.precisionGeolocation" pad-grade/platform.js
          grep -F 'src="recovery-visual-v073.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="map-instance-hook-v064.js' pad-grade/index.html
          grep -F 'src="map.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v063-dev.js?v=20260825-6' pad-grade/index.html
          grep -F 'src="v065-dev.js?v=20260829-3' pad-grade/index.html
          grep -F 'src="v075-startup.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="v090-first-run-guard.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="v088-project-list-layout.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v090-project-switch-boundary.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="v089-imagery-recovery.js?v=20260829-1' pad-grade/index.html
          grep -F "__padGradePreloadedProjectId" pad-grade/v075-startup.js
          grep -F "__padGradeStartupMapSizePreapplied" pad-grade/v075-startup.js
          grep -F "__padGradeRequestSettledStartupReveal" pad-grade/v075-startup.js
          grep -F "local-project-settled" pad-grade/v075-startup.js
          grep -F "setTimeout(finishReveal,1400)" pad-grade/v075-startup.js
          grep -F "head-cover-normal-load-and-switch-before-project-managers" pad-grade/recovery-visual-v073.js
          grep -F "padGradeProjectSwitchTargetV091" pad-grade/recovery-visual-v073.js
          grep -F "preapply-before-map-coalesced-runtime-resize" pad-grade/v069-dev.js
          ! grep -F "Date.now()+60000" pad-grade/v072-project-restore.js
          grep -F "background-never-block-visible-grid" pad-grade/v072-project-restore.js
          grep -F "revealLocalImmediately" pad-grade/v072-project-restore.js
          grep -F "padgrade-active-project-applied" pad-grade/v072-project-restore.js
          grep -F "const id=currentActive||settings?.lastProjectId||null" pad-grade/v072-project-restore.js
          grep -F "frameSavedPad" pad-grade/map.js
          grep -F "map.fitBounds" pad-grade/map.js
          grep -F "map.on('style.load',()=>frameSavedPad(false))" pad-grade/map.js
          grep -F "new Worker(WORKER_URL)" pad-grade/v063-dev.js
          grep -F "CANVAS_SOURCE_PREFIX='pad-grade-interpolated-surface-canvas-source-'" pad-grade/v063-dev.js
          grep -F "type:'canvas',canvas" pad-grade/v063-dev.js
          grep -F "ctx.createImageData" pad-grade/v063-dev.js
          grep -F "LOW_TIER=304" pad-grade/v063-dev.js
          grep -F "HIGH_TIER=888" pad-grade/v063-dev.js
          grep -F "atomicSwap:true" pad-grade/v063-dev.js
          grep -F "canvasSource:true" pad-grade/v063-dev.js
          grep -F "whole-raster-low-304-then-high-888-no-zoom-recalc" pad-grade/v063-dev.js
          grep -F "web-worker-whole-raster-double-buffered-canvas-atomic-swap-no-band-repaint" pad-grade/v063-dev.js
          grep -F "never publishes partial map bands" pad-grade/heatmap-raster-worker-v073.js
          grep -F "Math.abs(diff)<=tol" pad-grade/heatmap-raster-worker-v073.js
          grep -F "pgApplyHeatmapOpacity" pad-grade/v066-dev.js
          grep -F "window.__padGradeDurableSyncV040=true" pad-grade/v040-sync.js
          grep -F "late-owner-settings-first-then-project-sync-visual-hold" pad-grade/v071-dev.js
          grep -F "__padGradeBeginRecoveryVisualHold" pad-grade/v071-dev.js
          grep -F "v072-project-restore.js?v=20260829-3" pad-grade/v065-dev.js
          grep -F "v085-map-render-order.js?v=20260829-3" pad-grade/v078-dev.js
          grep -F "v086-compare-presentation.js?v=20260829-2" pad-grade/v085-map-render-order.js
          grep -F "padgrade-maplibre-ready" pad-grade/v085-map-render-order.js
          grep -F "pgCompareLegendBar" pad-grade/v086-compare-presentation.js
          grep -F "reserved-before-hydration-no-row-shift" pad-grade/v088-project-list-layout.js
          grep -F "Map imagery unavailable — retrying" pad-grade/v089-imagery-recovery.js
          grep -F "explain-opt-in-before-durable-folder-picker" pad-grade/v090-first-run-guard.js
          grep -F "Choose durable folder" pad-grade/v090-first-run-guard.js
          grep -F "cover-before-handler-carry-target-reload-before-paint" pad-grade/v090-project-switch-boundary.js
          grep -F "__padGradeBeginProjectTransition" pad-grade/v090-project-switch-boundary.js
          grep -F "if (!projectFileCacheLoaded) {" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java
          grep -F "primeProjectFileCacheAsync();" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java
          grep -F "if (!projectFileCacheLoaded) { primeProjectFileCacheAsync(); return null; }" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java
          grep -F "__padGradeProjectFolderSelectionCancelled" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java
          grep -F "Green is categorical" pad-grade/v067-dev.js
          grep -F "#4f8f3a 46%,#4f8f3a 54%" pad-grade/v067-dev.js
          grep -F "magnitude-aware IDW² zero crossing" pad-grade/dev-selftest.js
          grep -F "Metric units" pad-grade/README.md
          grep -F "Feet and tenths" pad-grade/README.md
          grep -F "Laser-avoidance pathing" pad-grade/README.md

      - name: Run Pad Grade dev self-tests
        run: node pad-grade/dev-selftest.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Resolve app version and channel
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' pad-grade-android/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]\.[0-9]$'
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            CHANNEL=stable
            RELEASE_TAG="pad-grade-v$VERSION"
          elif [ "$BRANCH" = "pad-grade-dev" ]; then
            CHANNEL=dev
            RELEASE_TAG="pad-grade-dev-v$VERSION"
          else
            CHANNEL=pr
            RELEASE_TAG="pad-grade-pr-v$VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "APK_NAME=Pad-Grade-v$VERSION.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=pad-grade-$CHANNEL" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          if [ "$BUILD_CHANNEL" = "dev" ]; then
            gradle -p pad-grade-android :app:assembleDebug -PpadGradeDevBuild=true --stacktrace
          else
            gradle -p pad-grade-android :app:assembleDebug --stacktrace
          fi

      - name: Verify canonical web assets packaged
        run: |
          APK=pad-grade-android/app/build/outputs/apk/debug/app-debug.apk
          for asset in index.html platform.js map.js maplibre-loader.js v040.js v040-sync.js v041.js v041-persist.js migration-core.js grid-core.js map-instance-hook-v064.js recovery-visual-v073.js v060-dev.js v061-dev.js v062-dev.js v063-dev.js v064-dev.js v065-dev.js v066-dev.js v067-dev.js v069-dev.js v070-dev.js v071-dev.js v071-map-ui.js v072-project-restore.js v075-startup.js v078-dev.js project-compare-core.js v081-project-compare.js v082-project-compare-fix.js v083-project-compare-fix.js v085-map-render-order.js v086-compare-presentation.js v087-compare-back.js v088-project-list-layout.js v089-imagery-recovery.js v090-first-run-guard.js v090-project-switch-boundary.js heatmap-raster-worker-v073.js; do
            unzip -l "$APK" | grep "assets/$asset"
          done
          unzip -l "$APK" | grep 'assets/vendor/maplibre-gl.js'
          unzip -l "$APK" | grep 'assets/vendor/maplibre-gl.css'
          unzip -p "$APK" assets/index.html | grep -F 'src="recovery-visual-v073.js?v=20260829-2'
          unzip -p "$APK" assets/index.html | grep -F 'src="v090-first-run-guard.js?v=20260829-2'
          unzip -p "$APK" assets/index.html | grep -F 'src="v065-dev.js?v=20260829-3'
          unzip -p "$APK" assets/index.html | grep -F 'src="v075-startup.js?v=20260829-2'
          unzip -p "$APK" assets/index.html | grep -F 'src="v088-project-list-layout.js?v=20260829-1'
          unzip -p "$APK" assets/index.html | grep -F 'src="v090-project-switch-boundary.js?v=20260829-2'
          unzip -p "$APK" assets/index.html | grep -F 'src="v089-imagery-recovery.js?v=20260829-1'
          unzip -p "$APK" assets/recovery-visual-v073.js | grep -F "head-cover-normal-load-and-switch-before-project-managers"
          unzip -p "$APK" assets/v072-project-restore.js | grep -F "background-never-block-visible-grid"
          unzip -p "$APK" assets/v072-project-restore.js | grep -F "const id=currentActive||settings?.lastProjectId||null"
          ! unzip -p "$APK" assets/v072-project-restore.js | grep -F "Date.now()+60000"
          unzip -p "$APK" assets/v075-startup.js | grep -F "local-project-settled"
          unzip -p "$APK" assets/map.js | grep -F "map.fitBounds"
          unzip -p "$APK" assets/map.js | grep -F "map.on('style.load',()=>frameSavedPad(false))"
          unzip -p "$APK" assets/v085-map-render-order.js | grep -F "v086-compare-presentation.js?v=20260829-2"
          unzip -p "$APK" assets/v085-map-render-order.js | grep -F "padgrade-maplibre-ready"
          unzip -p "$APK" assets/v086-compare-presentation.js | grep -F "pgCompareLegendBar"
          unzip -p "$APK" assets/v088-project-list-layout.js | grep -F "reserved-before-hydration-no-row-shift"
          unzip -p "$APK" assets/v089-imagery-recovery.js | grep -F "Map imagery unavailable — retrying"
          unzip -p "$APK" assets/v090-first-run-guard.js | grep -F "explain-opt-in-before-durable-folder-picker"
          unzip -p "$APK" assets/v090-project-switch-boundary.js | grep -F "cover-before-handler-carry-target-reload-before-paint"
          unzip -p "$APK" assets/v063-dev.js | grep -F "CANVAS_SOURCE_PREFIX='pad-grade-interpolated-surface-canvas-source-'"
          unzip -p "$APK" assets/v063-dev.js | grep -F "canvasSource:true"
          unzip -p "$APK" assets/v063-dev.js | grep -F "whole-raster-low-304-then-high-888-no-zoom-recalc"
          unzip -p "$APK" assets/heatmap-raster-worker-v073.js | grep -F "never publishes partial map bands"

      - name: Verify package channel, launcher icon, and WebP integrity
        run: |
          APK=pad-grade-android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          if [ "$BUILD_CHANNEL" = "dev" ]; then
            "$AAPT" dump badging "$APK" | grep "package: name='com.lordofrealms.padgrade.dev'"
            "$AAPT" dump badging "$APK" | grep "application-label:'Pad Grade DEV'"
          elif [ "$BUILD_CHANNEL" = "stable" ]; then
            "$AAPT" dump badging "$APK" | grep "package: name='com.lordofrealms.padgrade'"
            "$AAPT" dump badging "$APK" | grep "application-label:'Pad Grade'"
          fi
          unzip -l "$APK" | grep 'res/mipmap-nodpi-v4/ic_launcher.webp'
          unzip -l "$APK" | grep 'res/mipmap-nodpi-v4/ic_launcher_round.webp'
          if unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'; then
            echo 'Unexpected adaptive launcher override remains in APK' >&2
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep "application-icon" | grep 'ic_launcher'
          unzip -p "$APK" res/mipmap-nodpi-v4/ic_launcher.webp > /tmp/ic_launcher.webp
          unzip -p "$APK" res/mipmap-nodpi-v4/ic_launcher_round.webp > /tmp/ic_launcher_round.webp
          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/ic_launcher.webp', '/tmp/ic_launcher_round.webp'):
              data = Path(name).read_bytes()
              assert data[:4] == b'RIFF', f'{name}: missing RIFF header'
              assert data[8:12] == b'WEBP', f'{name}: missing WEBP signature'
              declared = int.from_bytes(data[4:8], 'little') + 8
              actual = len(data)
              assert declared == actual, f'{name}: truncated WebP: declared {declared}, actual {actual}'
              assert actual > 4000, f'{name}: unexpectedly small launcher file: {actual}'
              print(f'{name}: valid WebP, {actual} bytes')
          PY

      - name: Name APK
        run: cp pad-grade-android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish stable GitHub Release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Pad Grade Mapper — stable Android build. See the canonical Pad Grade changelog for the changes in v$APP_VERSION."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Pad Grade v$APP_VERSION" --notes "$NOTES"
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "Pad Grade v$APP_VERSION" --notes "$NOTES"
          fi

      - name: Publish dev GitHub Pre-release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/pad-grade-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Pad Grade Mapper — development/test Android build from pad-grade-dev. See the canonical Pad Grade changelog for the changes in v$APP_VERSION. Installs separately from stable as Pad Grade DEV."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Pad Grade v$APP_VERSION — DEV BUILD" --notes "$NOTES" --prerelease
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "Pad Grade v$APP_VERSION — DEV BUILD" --notes "$NOTES" --prerelease
          fi

      - name: Verify stable GitHub Release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"

      - name: Verify dev GitHub Pre-release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/pad-grade-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = "true"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
