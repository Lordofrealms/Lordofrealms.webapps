name: Pad Grade Android

on:
  push:
    branches: [main]
    paths:
      - 'pad-grade-android/ci-build-trigger.txt'
      - '.github/workflows/pad-grade-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pad-grade-android/ci-build-trigger.txt'
      - '.github/workflows/pad-grade-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web scripts
        run: |
          node --check pad-grade/capture-fix.js
          node --check pad-grade/v030.js
          node --check pad-grade/v031.js
          node --check pad-grade/v040.js
          node --check pad-grade/v040-sync.js
          node --check pad-grade/v041.js
          node --check pad-grade/v041-persist.js
          node --check pad-grade/v042.js
          node --check pad-grade/v043.js
          node --check pad-grade/v046.js
          node --check pad-grade/v047.js
          node --check pad-grade/v048.js
          node --check pad-grade/v049.js
          node --check pad-grade/v050.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Resolve app version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' pad-grade-android/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=Pad-Grade-v$VERSION.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=pad-grade-v$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p pad-grade-android :app:assembleDebug --stacktrace

      - name: Verify canonical web assets packaged
        run: |
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/index.html'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/platform.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v040.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v040-sync.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v040.css'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v041.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v041-persist.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v041.css'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v042.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v042.css'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v043.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v046.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v047.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v048.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v049.js'
          unzip -l pad-grade-android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v050.js'

      - name: Name APK
        run: cp pad-grade-android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pad-grade-debug
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "Pad Grade v$APP_VERSION" \
              --notes "Validated Pad Grade Android v$APP_VERSION build. Direct APK asset published by the same workflow that compiled and packaged the app."
          fi

      - name: Verify GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
