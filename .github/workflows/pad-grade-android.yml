name: Pad Grade Android

on:
  push:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-android.yml'
  pull_request:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-android.yml'
  workflow_dispatch:

concurrency:
  group: pad-grade-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web scripts
        run: |
          for script in \
            capture-fix.js map.js map-instance-hook-v064.js recovery-visual-v073.js \
            v030.js v031.js v040.js v040-sync.js v041.js v041-persist.js v042.js \
            v043.js v046.js v047.js v048.js v049.js v050.js v051.js v052.js v053.js \
            v060-dev.js v061-dev.js v062-dev.js v063-dev.js v064-dev.js v065-dev.js \
            v066-dev.js v067-dev.js v069-dev.js v070-dev.js v071-dev.js v071-map-ui.js \
            v072-project-restore.js v075-startup.js v078-dev.js project-compare-core.js \
            v081-project-compare.js v082-project-compare-fix.js v083-project-compare-fix.js \
            v085-map-render-order.js v086-compare-presentation.js v087-compare-back.js \
            v088-project-list-layout.js v089-imagery-recovery.js v090-first-run-guard.js \
            v090-project-switch-boundary.js v095-map-grid-fastpath.js v095-reading-dialog.js \
            v096-diagnostics.js v096-dev-defaults.js v096-native-async.js v096-async-reconcile.js \
            project-format-v107.js v107-index-reconcile.js v107-compare-fast.js \
            heatmap-raster-worker-v073.js dev-selftest.js migration-core.js grid-core.js \
            grid-size-bootstrap-v094.js grid-size-worker-v094.js; do
            node --check "pad-grade/$script"
          done
          node --check pad-grade/project-format-v107-selftest.js
          node --check pad-grade/v107-index-reconcile-selftest.js

      - name: Verify startup, grid, storage, and CanvasSource heatmap gates
        run: |
          grep -F "padGradeHeatmapOptInV061" pad-grade/v062-dev.js
          grep -F "platform.precisionGeolocation" pad-grade/platform.js
          grep -F 'src="recovery-visual-v073.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="map-instance-hook-v064.js' pad-grade/index.html
          grep -F 'src="map.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v063-dev.js?v=20260825-6' pad-grade/index.html
          grep -F 'src="v065-dev.js?v=20260829-3' pad-grade/index.html
          grep -F 'src="v075-startup.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="v090-first-run-guard.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="v088-project-list-layout.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v090-project-switch-boundary.js?v=20260829-2' pad-grade/index.html
          grep -F 'src="v089-imagery-recovery.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v096-diagnostics.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v096-dev-defaults.js?v=20260829-1' pad-grade/index.html
          grep -F 'src="v096-native-async.js?v=20260829-1' pad-grade/index.html
          grep -F "__padGradePreloadedProjectId" pad-grade/v075-startup.js
          grep -F "__padGradeStartupMapSizePreapplied" pad-grade/v075-startup.js
          grep -F "local-project-settled" pad-grade/v075-startup.js
          grep -F "setTimeout(finishReveal,1400)" pad-grade/v075-startup.js
          grep -F "head-cover-normal-load-and-switch-before-project-managers" pad-grade/recovery-visual-v073.js
          grep -F "background-never-block-visible-grid" pad-grade/v072-project-restore.js
          ! grep -F "Date.now()+60000" pad-grade/v072-project-restore.js
          grep -F "frameSavedPad" pad-grade/map.js
          grep -F "map.fitBounds" pad-grade/map.js
          grep -F "new Worker(WORKER_URL)" pad-grade/v063-dev.js
          grep -F "LOW_TIER=304" pad-grade/v063-dev.js
          grep -F "HIGH_TIER=888" pad-grade/v063-dev.js
          grep -F "atomicSwap:true" pad-grade/v063-dev.js
          grep -F "canvasSource:true" pad-grade/v063-dev.js
          grep -F "never publishes partial map bands" pad-grade/heatmap-raster-worker-v073.js
          grep -F "Math.abs(diff)<=tol" pad-grade/heatmap-raster-worker-v073.js
          grep -F "dev-on-stable-off" pad-grade/v096-dev-defaults.js

          # v1.0.7 durable-format/index architecture replaces the old recurring
          # v096 full-file reconciliation controller on the runtime path.
          grep -F "CURRENT_SCHEMA=6,ROLLBACK_SCHEMA=5" pad-grade/project-format-v107.js
          grep -F "project-format-v107.js?v=20260830-1" pad-grade/v096-native-async.js
          grep -F "v107-index-reconcile.js?v=20260830-1" pad-grade/v096-native-async.js
          grep -F "v107-compare-fast.js?v=20260830-1" pad-grade/v096-native-async.js
          grep -F "Pad-Grade-Project-Index.pgindex" pad-grade/v107-index-reconcile.js
          grep -F "zeroProjectReads" pad-grade/v107-index-reconcile.js
          grep -F "needsUpgrade" pad-grade/v107-index-reconcile.js
          grep -F "downgradeFolderToV5" pad-grade/v107-index-reconcile.js
          grep -F "listProjectFileDetails" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java
          grep -F "readProjectFileHeadAsync" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java
          grep -F "refreshProjectFileIndexAsync" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java
          grep -F "onHostResume" pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java
          grep -F "superseded-by-v107-authoritative-renderer" pad-grade/v086-compare-presentation.js
          grep -F "compare.grid-visible" pad-grade/v107-compare-fast.js
          grep -F "compare.low-heat-visible" pad-grade/v107-compare-fast.js
          grep -F "compare.high-heat-visible" pad-grade/v107-compare-fast.js
          grep -F "'circle-radius':6" pad-grade/v107-compare-fast.js
          grep -F "'text-field':['get','label']" pad-grade/v107-compare-fast.js
          grep -F "pgCompareLegendV086" pad-grade/v107-compare-fast.js

      - name: Run Pad Grade regression self-tests
        run: |
          node pad-grade/dev-selftest.js
          node pad-grade/project-compare-selftest.js
          node pad-grade/project-format-v107-selftest.js
          node pad-grade/v107-index-reconcile-selftest.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Resolve app version and channel
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' pad-grade-android/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            CHANNEL=stable
            RELEASE_TAG="pad-grade-v$VERSION"
          elif [ "$BRANCH" = "pad-grade-dev" ]; then
            CHANNEL=dev
            RELEASE_TAG="pad-grade-dev-v$VERSION"
          else
            CHANNEL=pr
            RELEASE_TAG="pad-grade-pr-v$VERSION"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "APK_NAME=Pad-Grade-v$VERSION.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=pad-grade-$CHANNEL" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify release notes match app version
        run: |
          test -s pad-grade/RELEASE_NOTES.md
          grep -F "## v$APP_VERSION —" pad-grade/RELEASE_NOTES.md

      - name: Build debug APK
        run: |
          if [ "$BUILD_CHANNEL" = "dev" ]; then
            gradle -p pad-grade-android :app:assembleDebug -PpadGradeDevBuild=true --stacktrace
          else
            gradle -p pad-grade-android :app:assembleDebug --stacktrace
          fi

      - name: Verify canonical web assets packaged
        run: |
          APK=pad-grade-android/app/build/outputs/apk/debug/app-debug.apk
          for asset in \
            index.html platform.js map.js maplibre-loader.js v040.js v040-sync.js \
            v041.js v041-persist.js migration-core.js grid-core.js grid-size-bootstrap-v094.js \
            grid-size-worker-v094.js map-instance-hook-v064.js recovery-visual-v073.js \
            v060-dev.js v061-dev.js v062-dev.js v063-dev.js v064-dev.js v065-dev.js \
            v066-dev.js v067-dev.js v069-dev.js v070-dev.js v071-dev.js v071-map-ui.js \
            v072-project-restore.js v075-startup.js v078-dev.js project-compare-core.js \
            v081-project-compare.js v082-project-compare-fix.js v083-project-compare-fix.js \
            v085-map-render-order.js v086-compare-presentation.js v087-compare-back.js \
            v088-project-list-layout.js v089-imagery-recovery.js v090-first-run-guard.js \
            v090-project-switch-boundary.js v095-map-grid-fastpath.js v095-reading-dialog.js \
            v096-diagnostics.js v096-dev-defaults.js v096-native-async.js \
            project-format-v107.js v107-index-reconcile.js v107-compare-fast.js \
            heatmap-raster-worker-v073.js; do
            unzip -l "$APK" | grep "assets/$asset"
          done
          unzip -l "$APK" | grep 'assets/vendor/maplibre-gl.js'
          unzip -l "$APK" | grep 'assets/vendor/maplibre-gl.css'
          unzip -p "$APK" assets/index.html | grep -F 'src="v096-native-async.js?v=20260829-1'
          unzip -p "$APK" assets/project-format-v107.js | grep -F "CURRENT_SCHEMA=6,ROLLBACK_SCHEMA=5"
          unzip -p "$APK" assets/v096-native-async.js | grep -F "v107-index-reconcile.js?v=20260830-1"
          unzip -p "$APK" assets/v096-native-async.js | grep -F "v107-compare-fast.js?v=20260830-1"
          unzip -p "$APK" assets/v107-index-reconcile.js | grep -F "Pad-Grade-Project-Index.pgindex"
          unzip -p "$APK" assets/v107-index-reconcile.js | grep -F "zeroProjectReads"
          unzip -p "$APK" assets/v107-compare-fast.js | grep -F "compare.grid-visible"
          unzip -p "$APK" assets/v107-compare-fast.js | grep -F "pgCompareLegendV086"
          unzip -p "$APK" assets/v086-compare-presentation.js | grep -F "superseded-by-v107-authoritative-renderer"
          unzip -p "$APK" assets/v063-dev.js | grep -F "canvasSource:true"
          unzip -p "$APK" assets/heatmap-raster-worker-v073.js | grep -F "never publishes partial map bands"

      - name: Verify package channel, launcher icon, and WebP integrity
        run: |
          APK=pad-grade-android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          if [ "$BUILD_CHANNEL" = "dev" ]; then
            "$AAPT" dump badging "$APK" | grep "package: name='com.lordofrealms.padgrade.dev'"
            "$AAPT" dump badging "$APK" | grep "application-label:'Pad Grade DEV'"
          elif [ "$BUILD_CHANNEL" = "stable" ]; then
            "$AAPT" dump badging "$APK" | grep "package: name='com.lordofrealms.padgrade'"
            "$AAPT" dump badging "$APK" | grep "application-label:'Pad Grade'"
          fi
          unzip -l "$APK" | grep 'res/mipmap-nodpi-v4/ic_launcher.webp'
          unzip -l "$APK" | grep 'res/mipmap-nodpi-v4/ic_launcher_round.webp'
          if unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'; then
            echo 'Unexpected adaptive launcher override remains in APK' >&2
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep "application-icon" | grep 'ic_launcher'
          unzip -p "$APK" res/mipmap-nodpi-v4/ic_launcher.webp > /tmp/ic_launcher.webp
          unzip -p "$APK" res/mipmap-nodpi-v4/ic_launcher_round.webp > /tmp/ic_launcher_round.webp
          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/ic_launcher.webp', '/tmp/ic_launcher_round.webp'):
              data = Path(name).read_bytes()
              assert data[:4] == b'RIFF', f'{name}: missing RIFF header'
              assert data[8:12] == b'WEBP', f'{name}: missing WEBP signature'
              declared = int.from_bytes(data[4:8], 'little') + 8
              assert declared == len(data), f'{name}: truncated WebP'
              assert len(data) > 4000, f'{name}: unexpectedly small launcher file'
              print(f'{name}: valid WebP, {len(data)} bytes')
          PY

      - name: Name APK
        run: cp pad-grade-android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish stable GitHub Release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Pad Grade v$APP_VERSION" --notes-file pad-grade/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "Pad Grade v$APP_VERSION" --notes-file pad-grade/RELEASE_NOTES.md
          fi

      - name: Publish dev GitHub Pre-release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/pad-grade-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Pad Grade v$APP_VERSION — DEV BUILD" --notes-file pad-grade/RELEASE_NOTES.md --prerelease
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "Pad Grade v$APP_VERSION — DEV BUILD" --notes-file pad-grade/RELEASE_NOTES.md --prerelease
          fi

      - name: Verify stable GitHub Release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
          gh release view "$RELEASE_TAG" --json body --jq '.body' | grep -F "## v$APP_VERSION —"

      - name: Verify dev GitHub Pre-release APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/pad-grade-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = "true"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
          gh release view "$RELEASE_TAG" --json body --jq '.body' | grep -F "## v$APP_VERSION —"
