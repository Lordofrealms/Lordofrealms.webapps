name: Pad Grade v1.1.9 Patch2 Temp

on:
  push:
    branches:
      - pad-grade-dev-v119-heat-cutover

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v119-heat-cutover
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply permission/runtime test patch
        run: python v119_patch2.py
      - name: Validate v1.1.9
        run: |
          node --check pad-grade/v119-dev.js
          node pad-grade/v119-heat-cutover-selftest.js
          node pad-grade/v119-runtime-selftest.js
          git diff --check
      - name: Commit patch
        run: |
          rm v119_patch2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] [v119-patch2] Complete Pad Grade v1.1.9 permission and runtime validation'
          git push origin HEAD:pad-grade-dev-v119-heat-cutover
