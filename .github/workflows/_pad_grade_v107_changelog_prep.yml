name: Pad Grade v1.0.7 Changelog Prep

on:
  push:
    branches: [pad-grade-dev-v107-index-compare]
    paths: ['.github/v107-changelog-trigger.txt']

permissions:
  contents: write

env:
  WEB_ENTRY_B64: ""
  ANDROID_ENTRY_B64: ""

jobs:
  prepend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v107-index-compare
          fetch-depth: 0
      - name: Prepend detailed v1.0.7 changelogs and title
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          web=base64.b64decode(os.environ['WEB_ENTRY_B64']).decode()
          android=base64.b64decode(os.environ['ANDROID_ENTRY_B64']).decode()
          for path, entry in [(Path('pad-grade/CHANGELOG.md'),web),(Path('pad-grade-android/CHANGELOG.md'),android)]:
              text=path.read_text()
              if '## v1.0.7 — development build' not in text:
                  marker='## v1.0.6 — development build'
                  if marker not in text: raise SystemExit(f'marker missing in {path}')
                  path.write_text(text.replace(marker,entry+marker,1))
          p=Path('pad-grade/index.html'); text=p.read_text(); p.write_text(text.replace('Pad Grade Mapper v1.0.6 DEV','Pad Grade Mapper v1.0.7 DEV'))
          PY
          git config user.name 'Pad Grade CI'
          git config user.email 'actions@users.noreply.github.com'
          git add pad-grade/CHANGELOG.md pad-grade-android/CHANGELOG.md pad-grade/index.html
          git diff --cached --quiet || git commit -m 'Pad Grade v1.0.7: document indexed comparison candidate'
          git push origin HEAD:pad-grade-dev-v107-index-compare
