name: Apply Pad Grade v1.1.3

"on":
  push:
    branches: [pad-grade-dev-v113-reuse-cache]
    paths:
      - '.v113-parts/**'
      - '.v113-patchparts/**'
      - '.github/workflows/pad-grade-v113-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and apply v1.1.3
        run: |
          mkdir -p tools
          cat .v113-patchparts/p* > tools/apply_pad_grade_v113.py
          python -m py_compile tools/apply_pad_grade_v113.py
          python tools/apply_pad_grade_v113.py
          rm -rf .v113-patchparts tools/__pycache__
          # GitHub Actions tokens cannot create/update workflow files. Keep those
          # untouched in the bot commit; they are updated directly after source materialization.
          git checkout HEAD -- .github/workflows
          rm -f .github/workflows/pad-grade-v113-reuse-cache.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Implement Pad Grade v1.1.3 DEV [v113-patch]'
          git push
