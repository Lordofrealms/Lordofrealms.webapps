name: Pad Grade v1.0.6 release prep

on:
  push:
    branches: [pad-grade-dev-v106-fixed-hitbox]
    paths:
      - '.github/workflows/pad-grade-v106-release-prep.yml'

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v106-fixed-hitbox

      - name: Finalize v1.0.6 app and changelog files
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('pad-grade/index.html',
                       '<title>Pad Grade Mapper v1.0.5 DEV</title>',
                       '<title>Pad Grade Mapper v1.0.6 DEV</title>')
          replace_once('pad-grade/index.html',
                       '<script src="v104-map-tap-diagnostics.js?v=20260830-2"></script>\n<script src="v105-map-hitbox.js?v=20260830-1"></script>',
                       '<script src="v106-map-hitbox.js?v=20260830-1"></script>')

          canonical_entry = '''## v1.0.6 — development build\n\n### Changed\n- Promoted the GPS/MapLibre survey-point near-miss padding from the v1.0.5 field-test control to a fixed **15% of projected point-to-point spacing**. Field testing found 15% noticeably easier to hit than the original visible circles without feeling excessively large or intrusive.\n- Removed the user-facing **Map grid hitbox padding** slider from **Settings → Advanced Settings**. The release-candidate runtime ignores any `mapGridHitboxPaddingPct` value left in local preferences by v1.0.5 and always uses the fixed 15% behavior.\n- Removed the user-facing **Map tap diagnostics** switch and stopped loading the v1.0.4 map-tap tracer/crosshair during normal startup. Any old `mapTapDiagnosticsEnabled` preference is therefore inert in this build. The general application diagnostic timing log remains a separate existing Advanced Settings feature.\n- Kept the v1.0.5 safety rules unchanged: taps directly on visible point circles use the established MapLibre layer-click path; expanded hit testing only supplements near misses; total clickable semi-axes remain capped at **45% of neighboring point spacing**; a near miss must match exactly one point; there is no nearest-point fallback or tie-breaking guess; and **Probe Surface** mode owns its taps without expanded measurement-point hit testing.\n- Android DEV package is **version 1.0.6 / build 78**. Build 77 remains the adjustable v1.0.5 field-test package and is not reused.\n- The lower rectangular measurement grid remains unchanged from the restored v1.0.2 baseline; the withdrawn v1.0.3 lower-grid experiment remains absent.\n- This build is intended as the final DEV confirmation of the field-selected map hitbox behavior before promotion to the stable channel, assuming device verification is clean.\n\n### Known issues\n- This is still a development build. Confirm normal point-center taps, a representative set of near-miss taps a few pixels outside the visible circles, **Probe Surface**, project switching, and ordinary GPS-guided recording once more on-device before stable promotion.\n- The earlier intermittent wrong-point opening was not reproduced during diagnostic testing. v1.0.6 therefore preserves the exact-one-match/dead-space safeguards rather than claiming to have corrected an unconfirmed coordinate-offset defect.\n\n'''
          p = Path('pad-grade/CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '## v1.0.5 — development build\n'
          if '## v1.0.6 — development build\n' not in text:
              if marker not in text:
                  raise SystemExit('canonical changelog v1.0.5 marker missing')
              p.write_text(text.replace(marker, canonical_entry + marker, 1), encoding='utf-8')

          android_entry = '''## v1.0.6 — development build\n\n### Changed\n- Bumped the separately installable DEV Android package to **version 1.0.6 / versionCode 78**. Build 77 remains the published v1.0.5 adjustable hitbox test and is not reused.\n- Packaged the field-selected GPS-map survey-point near-miss padding as a fixed **15% of projected point spacing** instead of exposing the v1.0.5 0–45% Advanced Settings slider. Existing v1.0.5 slider preferences are ignored.\n- Removed the map-specific **Map tap diagnostics** Advanced Settings control from the packaged runtime and no longer load the v1.0.4 MapLibre tap tracer or temporary **ML** crosshair during normal startup. Existing map-diagnostic preferences are inert.\n- Preserved the safety behavior validated in v1.0.5: visible-circle taps retain the existing MapLibre selection path; expanded hitboxes remain oriented with the projected grid; total semi-axes are capped at 45% of point spacing; exactly one expanded target must match; there is no nearest-point fallback; and Probe Surface bypasses expanded measurement hit testing.\n- The lower rectangular measurement grid is unchanged and the withdrawn v1.0.3 experiment remains absent.\n- This APK is the release-candidate DEV confirmation build intended for one final device check before stable promotion.\n\n### Known issues\n- Complete one final field pass at normal working zoom, including near-miss point taps and Probe Surface, before promoting this exact behavior to stable.\n\n'''
          p = Path('pad-grade-android/CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '## v1.0.5 — development build\n'
          if '## v1.0.6 — development build\n' not in text:
              if marker not in text:
                  raise SystemExit('android changelog v1.0.5 marker missing')
              p.write_text(text.replace(marker, android_entry + marker, 1), encoding='utf-8')
          PY

      - name: Commit finalized app and changelog files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pad-grade/index.html pad-grade/CHANGELOG.md pad-grade-android/CHANGELOG.md
          git commit -m 'Finalize v1.0.6 fixed 15 percent hitbox release candidate'
          git push origin HEAD:pad-grade-dev-v106-fixed-hitbox
