name: Pad Grade v1.0.7 Storage Hardening Prep

on:
  push:
    branches: [pad-grade-dev-v107-index-compare]
    paths: ['.github/v107-storage-hardening-trigger.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v107-index-compare
          fetch-depth: 0
      - name: Harden external discovery and migration retry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bridge=Path('pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java')
          s=bridge.read_text()
          old='    private volatile boolean projectFolderRecoveryPending = false;\n'
          assert old in s
          s=s.replace(old, old+'    private volatile long lastProjectFileRefreshRequestMs = 0L;\n',1)
          old='    @JavascriptInterface public void completeProjectFolderRecovery() { projectFolderRecoveryPending = false; }\n'
          assert old in s
          add='''    @JavascriptInterface public void completeProjectFolderRecovery() { projectFolderRecoveryPending = false; }\n    @JavascriptInterface public void refreshProjectFileIndexAsync() { refreshProjectFileCacheAsync(true); }\n\n    /** Recheck the chosen folder after returning from another app/device-copy workflow. */\n    public void onHostResume() {\n        long now = System.currentTimeMillis();\n        if (now - lastProjectFileRefreshRequestMs < 750L) return;\n        lastProjectFileRefreshRequestMs = now;\n        refreshProjectFileCacheAsync(true);\n    }\n'''
          s=s.replace(old,add,1)
          a=s.index('    private void ensureProjectFileCache() {')
          b=s.index('    private DocumentFile findProjectFile',a)
          repl='''    private void refreshProjectFileCacheAsync(boolean force) {\n        synchronized (folderCacheLock) {\n            if (projectFileCacheLoading) return;\n            if (!force && projectFileCacheLoaded) return;\n            projectFileCacheLoading = true;\n        }\n        Thread worker = new Thread(() -> {\n            long started = System.nanoTime();\n            boolean changed = false;\n            int count = 0;\n            try {\n                DocumentFile folder = getProjectFolder();\n                if (folder == null) return;\n                DocumentFile[] listed;\n                try { listed = folder.listFiles(); }\n                catch (RuntimeException ex) { listed = new DocumentFile[0]; }\n                Map<String, DocumentFile> nextFiles = new LinkedHashMap<>();\n                Map<String, Long> nextSizes = new LinkedHashMap<>(), nextModified = new LinkedHashMap<>();\n                for (DocumentFile file : listed) {\n                    if (file == null) continue;\n                    String name = file.getName(); if (name == null) continue;\n                    long size = 0L, mtime = 0L;\n                    try { size = Math.max(0L, file.length()); } catch (RuntimeException ignored) {}\n                    try { mtime = Math.max(0L, file.lastModified()); } catch (RuntimeException ignored) {}\n                    nextFiles.put(name, file); nextSizes.put(name, size); nextModified.put(name, mtime);\n                }\n                synchronized (folderCacheLock) {\n                    changed = !projectFileCache.keySet().equals(nextFiles.keySet());\n                    if (!changed) {\n                        for (String name : nextFiles.keySet()) {\n                            if (!projectFileSizeCache.getOrDefault(name, -1L).equals(nextSizes.getOrDefault(name, -2L)) ||\n                                !projectFileModifiedCache.getOrDefault(name, -1L).equals(nextModified.getOrDefault(name, -2L))) { changed = true; break; }\n                        }\n                    }\n                    projectFileCache.clear(); projectFileCache.putAll(nextFiles);\n                    projectFileSizeCache.clear(); projectFileSizeCache.putAll(nextSizes);\n                    projectFileModifiedCache.clear(); projectFileModifiedCache.putAll(nextModified);\n                    projectFileCacheLoaded = true; count = projectFileCache.size();\n                }\n            } finally {\n                synchronized (folderCacheLock) { projectFileCacheLoading = false; count = projectFileCache.size(); }\n                double durationMs = elapsedMs(started);\n                if (force) {\n                    evaluate("try{window.dispatchEvent(new CustomEvent('padgrade-project-folder-refreshed',{detail:{durationMs:" + durationMs + ",fileCount:" + count + ",changed:" + changed + "}}));}catch(e){}");\n                } else {\n                    evaluate("window.__padGradeProjectFolderIndexed && window.__padGradeProjectFolderIndexed();try{window.dispatchEvent(new CustomEvent('padgrade-project-folder-indexed',{detail:{durationMs:" + durationMs + ",fileCount:" + count + "}}));}catch(e){}");\n                }\n            }\n        }, force ? "PadGradeFolderRefresh" : "PadGradeFolderIndex");\n        worker.setDaemon(true); worker.start();\n    }\n\n    private void primeProjectFileCacheAsync() { refreshProjectFileCacheAsync(false); }\n\n'''
          s=s[:a]+repl+s[b:]
          bridge.write_text(s)

          main=Path('pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java')
          s=main.read_text()
          marker='    @Override protected void onSaveInstanceState(Bundle outState) {'
          assert marker in s
          resume='''    @Override protected void onResume() {\n        super.onResume();\n        if (nativeBridge != null) nativeBridge.onHostResume();\n    }\n\n'''
          s=s.replace(marker,resume+marker,1)
          main.write_text(s)

          idx=Path('pad-grade/v107-index-reconcile.js')
          s=idx.read_text()
          a=s.index('  async function migrateSingle(')
          b=s.index('  async function importBackup',a)
          new='''  async function migrateSingle(raw,filename,detail,used,rawText=null){\n    const sourceSchema=Number(raw?.schemaVersion||raw?.version||1),p=fmt.normalizeProject(raw,filename);if(!p)return [];\n    ensureFileId(p,filename,used);const target=canonicalName(p),text=fmt.serializeV6(p,target);\n    const writeNeeded=sourceSchema!==fmt.CURRENT_SCHEMA||!fmt.parseHeaderText(String(raw?._pgHeader?JSON.stringify({_pgHeader:raw._pgHeader}):''))||target!==filename;\n    let finalName=filename,finalDetail=detail,hash=null;\n    if(writeNeeded){\n      if(!criticalRecoveryActive()){\n        const ok=await rawWrite(target,text);\n        if(ok){finalName=target;if(target!==filename)await rawDelete(filename);const d=metadata().find(x=>x.name===target);if(d)finalDetail=d;hash=await sha256(text);diag()?.mark?.('project.schema-upgraded',{from:sourceSchema,to:6,filename,target});}\n        else{const e=entryFromProject(p,filename,detail,rawText?await sha256(rawText):null,null);e.schemaVersion=sourceSchema;e.needsUpgrade=true;diag()?.mark?.('project.schema-upgrade-deferred',{filename,sourceSchema,reason:'write-failed'});return[e];}\n      }else{const e=entryFromProject(p,filename,detail,rawText?await sha256(rawText):null,null);e.schemaVersion=sourceSchema;e.needsUpgrade=true;diag()?.mark?.('project.schema-upgrade-deferred',{filename,sourceSchema,reason:'recovery-write-locked'});return[e];}\n    }else hash=rawText?await sha256(rawText):await sha256(text);\n    putLocal(p);return [entryFromProject(p,finalName,finalDetail,hash,null)];\n  }\n'''
          s=s[:a]+new+s[b:]
          s=s.replace('if(prior.length&&prior.every(e=>sameMeta(e,detail))){','if(prior.length&&prior.every(e=>sameMeta(e,detail)&&!e.needsUpgrade)){',1)
          s=s.replace('return migrateSingle(raw,detail.name,detail,used);','return migrateSingle(raw,detail.name,detail,used,text);',1)
          marker="  window.addEventListener('padgrade-project-folder-indexed',()=>{if(indexReady())prepareMinimumRecovery();});\n"
          assert marker in s
          s=s.replace(marker,marker+"  window.addEventListener('padgrade-project-folder-refreshed',event=>{diag()?.mark?.('index.folder-metadata-refreshed',event?.detail||{});if(indexReady())scheduleSync(50,'folder-refreshed');});\n",1)
          idx.write_text(s)

          pres=Path('pad-grade/v086-compare-presentation.js')
          s=pres.read_text()
          s=s.replace("  function apply(){\n    installStyle();", "  function apply(){\n    if(window.__padGradeCompareFastV107)return false;\n    installStyle();",1)
          s=s.replace("    const timer=setInterval(()=>{\n      const mapEl", "    const timer=setInterval(()=>{\n      if(window.__padGradeCompareFastV107){clearInterval(timer);window.__padGradeComparePresentationV086='superseded-by-v107-authoritative-renderer';return;}\n      const mapEl",1)
          pres.write_text(s)
          PY
          git config user.name 'Pad Grade CI'
          git config user.email 'actions@users.noreply.github.com'
          git add pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java pad-grade/v107-index-reconcile.js pad-grade/v086-compare-presentation.js
          git commit -m 'Pad Grade v1.0.7: harden external folder refresh and migration retry'
          git push origin HEAD:pad-grade-dev-v107-index-compare
