name: Pad Grade v1.2.0 Carry-Forward Refresh Temp

on:
  push:
    branches:
      - pad-grade-dev-v120-maplibre516-image-fix

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v120-maplibre516-image-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh superseded carry-forward assertions
        run: python refresh_v120_carryforward.py
      - name: Run all Pad Grade self-tests
        run: |
          rm refresh_v120_carryforward.py
          node --check pad-grade/v120-dev.js
          node pad-grade/v120-heat-fix-selftest.js
          node pad-grade/v120-runtime-selftest.js
          node pad-grade/v119-heat-cutover-selftest.js
          node pad-grade/v116-background-suspend-selftest.js
          for f in pad-grade/*selftest.js; do node "$f"; done
          for f in pad-grade-v*-selftest.py; do [ -e "$f" ] && python "$f"; done
          git diff --check
      - name: Commit refreshed historical gates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Refresh Pad Grade carry-forward gates for v1.2.0'
          git push origin HEAD:pad-grade-dev-v120-maplibre516-image-fix
