name: Pad Grade v1.1.8 Apply

on:
  push:
    branches:
      - pad-grade-dev-v118-permission-heat-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v118-permission-heat-fix
          fetch-depth: 0
      - name: Apply v1.1.8 files
        run: |
          python .github/scripts/apply_pad_grade_v118.py
          sed -i "s/Path(__file__).resolve().parents\[1\]/Path(__file__).resolve().parent/" pad-grade-v118-selftest.py
      - name: Syntax and regression sanity
        run: |
          node --check pad-grade/v118-dev.js
          python pad-grade-v118-selftest.py
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pad-grade/v118-dev.js pad-grade-v118-selftest.py pad-grade/index.html pad-grade/CHANGELOG.md \
                  pad-grade-android/CHANGELOG.md pad-grade-android/app/build.gradle.kts \
                  pad-grade-android/app/src/main/AndroidManifest.xml \
                  pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java \
                  pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeLifecycleBridge.java
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Pad Grade v1.1.8 DEV permission and heat fixes"
            git push origin HEAD:pad-grade-dev-v118-permission-heat-fix
          fi
