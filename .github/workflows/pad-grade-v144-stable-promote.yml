name: Pad Grade v1.4.4 Stable Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pad-grade-v144-stable-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify promotion inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6f912ea1aff42d326faeb9cbc9636117f86f02f3"
          git fetch origin pad-grade-dev:refs/remotes/origin/pad-grade-dev
          test "$(git rev-parse refs/remotes/origin/pad-grade-dev)" = "c5009139e7f8edfaf8eda752151ca33a25859221"

      - name: Promote verified DEV application tree
        run: |
          set -euo pipefail
          cp pad-grade/CHANGELOG_STABLE.md /tmp/CHANGELOG_STABLE.md
          rm -rf pad-grade pad-grade-android
          git checkout refs/remotes/origin/pad-grade-dev -- pad-grade pad-grade-android
          cp /tmp/CHANGELOG_STABLE.md pad-grade/CHANGELOG_STABLE.md

      - name: Apply stable v1.4.4 metadata and documentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('pad-grade-android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text, n = re.subn(
              r'        // v1\.4\.3 DEV:[^\n]*\n        versionCode = 114\n        versionName = "1\.4\.3"',
              '        // v1.4.4 stable promotion of the field-verified v1.4.3 development line.\n        versionCode = 115\n        versionName = "1.4.4"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not update Android v1.4.4 metadata exactly once')
          gradle.write_text(text, encoding='utf-8')

          index = Path('pad-grade/index.html')
          text = index.read_text(encoding='utf-8')
          text, n = re.subn(
              r'<title>Pad Grade Mapper v[0-9]+\.[0-9]+\.[0-9]+(?: DEV)?</title>',
              '<title>Pad Grade Mapper v1.4.4</title>',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not update Pad Grade web title exactly once')
          index.write_text(text, encoding='utf-8')

          stable_section = '''## v1.4.4 — stable

Pad Grade v1.4.4 promotes the field-tested improvements made since the previous stable release, **v1.4.0**. This release focuses on project-file reliability and making sure every heat map uses the same intended surface calculation.

### More reliable projects and storage
- Pad Grade now checks project identities when restoring a persistent project folder. If copied or older files contain duplicate internal project IDs or duplicate six-character File IDs, the app repairs the conflict before normal project restoration continues.
- Project deletion is now coordinated across the saved project file, project list/index, local project state, and derived heat-map cache. A deleted project should no longer return as a non-openable “ghost” entry in Project Manager.
- Deleting copied projects correctly uses their human-readable six-character filename prefix instead of falling back to an obsolete filename.
- If a project file is already missing but an old list entry remains, deleting that entry is treated as successful cleanup rather than getting stuck on the missing file.

### Consistent heat maps
- Foreground heat maps, background-generated heat maps, and saved heat-map caches now all use the same nearby triangle/rectangle interpolation rules. This removes a case where some heat maps could use an older global interpolation method and look different from a freshly regenerated map of the same project.
- Older heat-map caches that do not identify the current local-surface calculation are rejected and rebuilt automatically once when needed. Project measurements and project files are not changed by this cache refresh.
- Project switching now retires the outgoing project’s completed heat state as well as cancelling obsolete worker activity, preventing old heat results from repeatedly trying to return after the switch.
- The existing progressive **99 → 297 → 891** heat-map sequence, parallel computation, and complete-frame/no-flicker presentation remain in place.

### Better troubleshooting history
- Optional diagnostic logging can now retain up to **50,000 entries** instead of the much smaller previous history, making longer field sessions easier to diagnose.
- Stable builds still default diagnostic logging **off** unless the user has explicitly enabled it.

### Unchanged
- No change was made to survey readings, target/grade calculations, earthwork-volume calculations, GPS geometry, aerial-imagery selection, or the map-reveal timing as part of these v1.4.1–v1.4.4 fixes.
- The field-tested folder-picker/recovery transition and existing atomic heat-map presentation remain unchanged.

### Stable promotion
- Stable Android version: **v1.4.4 build 115**.
- Stable package: `com.lordofrealms.padgrade`.
- The separately installable DEV package remains `com.lordofrealms.padgrade.dev`.
'''

          stable = Path('pad-grade/CHANGELOG_STABLE.md')
          old = stable.read_text(encoding='utf-8')
          marker = 'This file summarizes changes promoted to stable Pad Grade releases. Detailed development-by-development history remains in `CHANGELOG.md`.\n'
          if marker not in old:
              raise SystemExit('Stable changelog header marker missing')
          head, tail = old.split(marker, 1)
          stable.write_text(head + marker + '\n' + stable_section + '\n' + tail.lstrip(), encoding='utf-8')

          changelog = Path('pad-grade/CHANGELOG.md')
          dev_history = changelog.read_text(encoding='utf-8')
          technical = '''## v1.4.4 STABLE / build 115 — promote field-verified v1.4.1–v1.4.3 fixes

- Promotes the verified v1.4.3 application state to the stable package without changing heat-map scheduling, imagery, GPS geometry, grading math, or project-switch reveal timing.
- Carries forward v1.4.1 persistent project/File-ID integrity repair, 50,000-entry diagnostics, and stale heat-producer retirement.
- Carries forward v1.4.2 single-engine local triangle/rectangle heat interpolation and cache schema v2 invalidation of ambiguous legacy caches.
- Carries forward v1.4.3 authoritative project deletion and ghost-row cleanup, including exact File-ID-prefixed durable filenames.
- Stable-only changes are version/channel metadata, stable web title, and diagnostic logging default OFF while respecting an explicit user preference.

'''
          changelog.write_text(technical + dev_history, encoding='utf-8')
          PY

          cat > pad-grade/v096-dev-defaults.js <<'EOF'
          /* Pad Grade v1.4.4 stable defaults.
           * Diagnostic timing remains available from Advanced Settings, but stable builds
           * default it OFF unless the user has explicitly chosen otherwise.
           */
          (function installPadGrade096StableDefaults(){
            'use strict';
            const PREF_KEY='padGradeAppPrefsV1';
            let prefs={};
            try{const parsed=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');if(parsed&&typeof parsed==='object')prefs=parsed;}catch(e){}
            if(typeof prefs.diagnosticLogging!=='boolean'){
              try{window.PadGradeDiag?.setEnabled?.(false,'v1.4.4-stable-default');}catch(e){}
            }else{
              try{window.PadGradeDiag?.refreshEnabledFromPrefs?.('v1.4.4-explicit-preference');}catch(e){}
            }
            // v1.4.3: register delete ownership before the v1.0.7 lazy-load capture listener.
            if(!window.__padGradeDeleteCaptureV143){
              window.__padGradeDeleteCaptureV143=true;
              document.addEventListener('click',event=>{
                const btn=event.target?.closest?.('button[data-act="delete"]'),row=btn?.closest?.('[data-id]');
                if(!row)return;
                const handler=window.PadGradeDeleteConsistencyV143?.handleDeleteClick;
                if(typeof handler!=='function')return;
                event.preventDefault();event.stopImmediatePropagation();handler(event,btn,row);
              },true);
            }
            const markStable=()=>{
              try{document.title='Pad Grade Mapper v1.4.4';}catch(e){}
              window.__padGradeBuildChannel='stable';
              window.__padGradeStableVersion='1.4.4';
            };
            markStable();
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',markStable,{once:true});
            setTimeout(markStable,750);
            setTimeout(markStable,2000);
            window.__padGradeDiagnosticDefaultV096='dev-on-stable-off';
          })();
          EOF
          sed -i 's/^          //' pad-grade/v096-dev-defaults.js

          cat > pad-grade/RELEASE_NOTES.md <<'EOF'
          # Pad Grade Mapper v1.4.4 — STABLE

          ## v1.4.4 — what changed since v1.4.0

          Pad Grade v1.4.4 promotes the field-tested improvements made since the previous stable release, **v1.4.0**. The main changes are more reliable project-file handling and consistent heat-map interpolation.

          ### More reliable projects
          - Persistent project folders are checked for duplicate project/File IDs during restoration and repaired automatically before normal project loading continues.
          - Deleting a project now removes it consistently from saved storage and the project list, preventing deleted projects from returning as unusable “ghost” entries.
          - Copied projects with the six-character human-readable filename prefix are deleted using their real saved filename.
          - Already-missing project files can still have their stale Project Manager entry cleaned up normally.

          ### Consistent heat maps
          - Foreground, background, and cached heat maps now all use the same nearby triangle/rectangle interpolation rules. A project should no longer look different merely because one heat map came from a background/cache path and another was freshly regenerated.
          - Older heat-map caches with ambiguous interpolation history are automatically discarded and rebuilt once when needed. Your project measurements are not changed.
          - Project switching now retires obsolete completed heat state in addition to cancelling old computation, reducing unnecessary stale heat activity after a switch.
          - The existing progressive **99 → 297 → 891** generation, parallel processing, and complete-frame/no-flicker presentation are preserved.

          ### Better diagnostic history
          - Optional diagnostic history now retains up to **50,000 entries**, making longer troubleshooting sessions easier to capture.
          - Diagnostic logging still defaults **off** in the stable app unless you have explicitly enabled it.

          ### What has not changed
          - These fixes do not change survey readings, target/grade calculations, earthwork-volume calculations, GPS geometry, aerial imagery, or normal map reveal timing.

          ### Stable release
          - Stable Android version: **v1.4.4 build 115**.
          - Stable package: `com.lordofrealms.padgrade`.
          - DEV remains separately installable as `com.lordofrealms.padgrade.dev`.
          EOF
          sed -i 's/^          //' pad-grade/RELEASE_NOTES.md

      - name: Run focused promotion regressions
        run: |
          set -euo pipefail
          node --check pad-grade/v096-dev-defaults.js
          node --check pad-grade/v141-storage-integrity.js
          node --check pad-grade/v142-heat-consistency-selftest.js
          node --check pad-grade/v143-delete-consistency.js
          node --check pad-grade/v143-delete-consistency-selftest.js
          node pad-grade/v142-heat-consistency-selftest.js
          node pad-grade/v136-all-tier-parallel-selftest.js
          node pad-grade/v126-generation-cancel-selftest.js
          node pad-grade/v143-delete-consistency-selftest.js
          grep -F 'versionCode = 115' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.4.4"' pad-grade-android/app/build.gradle.kts
          grep -F '<title>Pad Grade Mapper v1.4.4</title>' pad-grade/index.html
          grep -F "setEnabled?.(false,'v1.4.4-stable-default')" pad-grade/v096-dev-defaults.js
          grep -F '__padGradeDeleteCaptureV143' pad-grade/v096-dev-defaults.js
          grep -F '## v1.4.4 — stable' pad-grade/CHANGELOG_STABLE.md
          grep -F '## v1.4.4 — what changed since v1.4.0' pad-grade/RELEASE_NOTES.md
          git diff --check

      - name: Commit stable promotion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A pad-grade pad-grade-android
          test -n "$(git status --porcelain -- pad-grade pad-grade-android)"
          git commit -m 'Promote Pad Grade v1.4.4 stable'
          git push origin HEAD:main
