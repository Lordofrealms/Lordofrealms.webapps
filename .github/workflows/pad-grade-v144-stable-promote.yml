# Promotion script revision 2: DEV regressions run before stable metadata.
name: Pad Grade v1.4.4 Stable Promotion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pad-grade-v144-stable-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified Pad Grade DEV state
        run: bash .github/scripts/pad-grade-v144-stable-promote.sh
