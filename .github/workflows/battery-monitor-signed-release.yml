name: Battery Monitor Signed Firmware Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA to build and sign'
        required: true
        type: string
      version:
        description: 'Exact firmware version from battery-monitor/firmware/idf/version.txt'
        required: true
        default: '0.1.0.2'
        type: string

permissions:
  contents: read

jobs:
  signed_firmware:
    name: Build and sign ESP32 firmware
    runs-on: ubuntu-latest
    environment: battery-monitor-production-signing
    env:
      BATMON_FIRMWARE_SIGNING_KEY_B64: ${{ secrets.BATMON_FIRMWARE_SIGNING_KEY_B64 }}
      BATMON_FIRMWARE_SIGNING_KEY_PASSWORD: ${{ secrets.BATMON_FIRMWARE_SIGNING_KEY_PASSWORD }}
      EXPECTED_KEY_FINGERPRINT: 69d6d94b706c57e783c6e2e4ad17e781e84d1e4e32addbcfca68976483be5e6e
    steps:
      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! '${{ inputs.source_sha }}' =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be an exact 40-character commit SHA.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate authoritative release version
        shell: bash
        run: |
          set -euo pipefail
          version_file='battery-monitor/firmware/idf/version.txt'
          test -f "$version_file" || { echo 'Authoritative firmware version.txt is missing.' >&2; exit 1; }
          source_version="$(tr -d '\r\n' < "$version_file")"
          if [[ "$source_version" != '${{ inputs.version }}' ]]; then
            echo "Requested release version '${{ inputs.version }}' does not match authoritative source version '$source_version'." >&2
            exit 1
          fi
          if [[ ! "$source_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([1-9][0-9]*)$ ]]; then
            echo "Authoritative version must be major.minor.patch.release_sequence: $source_version" >&2
            exit 1
          fi
          release_seq="${BASH_REMATCH[4]}"
          echo "BATMON_RELEASE_VERSION=$source_version" >> "$GITHUB_ENV"
          echo "BATMON_RELEASE_SEQ=$release_seq" >> "$GITHUB_ENV"

      - name: Validate production signing key is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BATMON_FIRMWARE_SIGNING_KEY_B64" || -z "$BATMON_FIRMWARE_SIGNING_KEY_PASSWORD" ]]; then
            echo 'Production firmware signing secrets are not configured.' >&2
            exit 1
          fi
          printf '%s' "$BATMON_FIRMWARE_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/battery-monitor-production-key.pem"
          chmod 600 "$RUNNER_TEMP/battery-monitor-production-key.pem"

      - name: Validate production signing key fingerprint
        shell: bash
        run: |
          set -euo pipefail
          pubder="$RUNNER_TEMP/battery-monitor-production-key.spki.der"
          openssl pkey -in "$RUNNER_TEMP/battery-monitor-production-key.pem" -passin env:BATMON_FIRMWARE_SIGNING_KEY_PASSWORD -pubout -outform DER -out "$pubder"
          actual="$(sha256sum "$pubder" | awk '{print $1}')"
          if [[ "$actual" != "$EXPECTED_KEY_FINGERPRINT" ]]; then
            echo "Production signing key fingerprint mismatch: $actual" >&2
            exit 1
          fi

      - name: Install pinned ESP-IDF 5.5.5
        shell: bash
        run: |
          set -euo pipefail
          idf="$RUNNER_TEMP/esp-idf"
          commit='b774170ff46c393eeb5e495ea37936038d3f4f4f'
          mkdir -p "$idf"
          git -C "$idf" init
          git -C "$idf" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$idf" fetch --depth=1 origin "$commit"
          git -C "$idf" checkout --detach FETCH_HEAD
          test "$(git -C "$idf" rev-parse HEAD)" = "$commit"
          git -C "$idf" submodule update --init --recursive --depth=1
          "$idf/install.sh" esp32
          echo "IDF_PATH=$idf" >> "$GITHUB_ENV"

      - name: Build authoritative firmware
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          bash battery-monitor/firmware/idf/build.sh "$RUNNER_TEMP/battery-monitor-firmware"

      - name: Validate embedded application version
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          image="$RUNNER_TEMP/battery-monitor-firmware/BatteryMonitor.ino.bin"
          info="$(python "$IDF_PATH/components/esptool_py/esptool/esptool.py" image_info "$image")"
          printf '%s\n' "$info"
          embedded="$(printf '%s\n' "$info" | sed -nE 's/.*App version:[[:space:]]*([^[:space:]]+).*/\1/p' | head -n1)"
          if [[ "$embedded" != "$BATMON_RELEASE_VERSION" ]]; then
            echo "Built application version '$embedded' does not match '$BATMON_RELEASE_VERSION'." >&2
            exit 1
          fi

      - name: Sign release firmware
        shell: bash
        run: |
          set -euo pipefail
          fw="$RUNNER_TEMP/battery-monitor-firmware"
          out="$RUNNER_TEMP/battery-monitor-signed"
          mkdir -p "$out"
          cp -a "$fw/." "$out/"

          key="$RUNNER_TEMP/battery-monitor-production-key.pem"
          for image in BatteryMonitor.ino.bin BatteryMonitor.ino.merged.bin; do
            openssl dgst -sha256 -sign "$key" -passin env:BATMON_FIRMWARE_SIGNING_KEY_PASSWORD \
              -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:digest \
              -out "$out/${image}.sig" "$out/$image"
            sha256sum "$out/$image" > "$out/${image}.sha256"
          done

          printf '%s\n' \
            "Battery Monitor signed firmware release" \
            "version=$BATMON_RELEASE_VERSION" \
            "software_release_sequence=$BATMON_RELEASE_SEQ" \
            "source_sha=${{ inputs.source_sha }}" \
            "signature_algorithm=RSA-3072-PSS-SHA256" \
            "production_spki_sha256=$EXPECTED_KEY_FINGERPRINT" \
            "application_update=BatteryMonitor.ino.bin + BatteryMonitor.ino.bin.sig" \
            "blank_first_install_only=BatteryMonitor.ino.merged.bin + BatteryMonitor.ino.merged.bin.sig" \
            "warning=Do not use merged plaintext first-install image as post-encryption recovery." \
            > "$out/RELEASE.txt"

      - name: Verify signatures and rejection gates
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/battery-monitor-signed"
          pub="$RUNNER_TEMP/battery-monitor-production-key.pub.pem"
          openssl pkey -in "$RUNNER_TEMP/battery-monitor-production-key.pem" -passin env:BATMON_FIRMWARE_SIGNING_KEY_PASSWORD -pubout -out "$pub"

          for image in BatteryMonitor.ino.bin BatteryMonitor.ino.merged.bin; do
            openssl dgst -sha256 -verify "$pub" -signature "$out/${image}.sig" \
              -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:digest \
              "$out/$image"

            cp "$out/$image" "$RUNNER_TEMP/tampered.bin"
            printf '\x00' | dd of="$RUNNER_TEMP/tampered.bin" bs=1 seek=128 count=1 conv=notrunc status=none
            if openssl dgst -sha256 -verify "$pub" -signature "$out/${image}.sig" \
              -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:digest \
              "$RUNNER_TEMP/tampered.bin"; then
              echo 'Tampered firmware unexpectedly verified.' >&2
              exit 1
            fi
          done

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/wrong-key.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/wrong-key.pem" -pubout -out "$RUNNER_TEMP/wrong-key.pub.pem"
          if openssl dgst -sha256 -verify "$RUNNER_TEMP/wrong-key.pub.pem" -signature "$out/BatteryMonitor.ino.bin.sig" \
            -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:digest \
            "$out/BatteryMonitor.ino.bin"; then
            echo 'Wrong-key signature verification unexpectedly succeeded.' >&2
            exit 1
          fi

      - name: Upload signed firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Battery-Monitor-Signed-Firmware-${{ inputs.version }}
          path: ${{ runner.temp }}/battery-monitor-signed

  windows_release:
    name: Build Windows package with signed firmware
    runs-on: windows-latest
    needs: signed_firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download signed firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Battery-Monitor-Signed-Firmware-${{ inputs.version }}
          path: ${{ runner.temp }}/battery-monitor-signed

      - name: Validate firmware metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'battery-monitor-signed\RELEASE.txt'
          if (-not (Test-Path $release)) { throw 'Signed firmware RELEASE.txt is missing.' }
          $text = Get-Content $release -Raw
          if ($text -notmatch "version=${{ inputs.version }}") { throw 'Signed firmware version metadata mismatch.' }
          if ($text -notmatch "source_sha=${{ inputs.source_sha }}") { throw 'Signed firmware source SHA metadata mismatch.' }
          if ($text -notmatch 'signature_algorithm=RSA-3072-PSS-SHA256') { throw 'Signed firmware algorithm metadata mismatch.' }
          if ($text -notmatch 'production_spki_sha256=69d6d94b706c57e783c6e2e4ad17e781e84d1e4e32addbcfca68976483be5e6e') { throw 'Signed firmware trust-root metadata mismatch.' }

      - name: Stage signed firmware for Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $PWD 'battery-monitor\windows\BatteryMonitor.Client\Firmware'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'battery-monitor-signed\BatteryMonitor.ino.bin') $target -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'battery-monitor-signed\BatteryMonitor.ino.bin.sig') $target -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'battery-monitor-signed\BatteryMonitor.ino.bin.sha256') $target -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'battery-monitor-signed\RELEASE.txt') $target -Force

      - name: Build self-contained Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore battery-monitor/windows/BatteryMonitor.Client/BatteryMonitor.Client.csproj
          dotnet publish battery-monitor/windows/BatteryMonitor.Client/BatteryMonitor.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP\battery-monitor-windows"

          $bundle = Join-Path $env:RUNNER_TEMP 'Battery-Monitor-Windows'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "$env:RUNNER_TEMP\battery-monitor-windows\*" $bundle -Recurse -Force
          Copy-Item 'battery-monitor/windows/README.md' $bundle -Force
          Copy-Item 'battery-monitor/docs/QUICK_START.md' $bundle -Force
          Copy-Item 'battery-monitor/docs/TESTING_GUIDE.md' $bundle -Force
          Copy-Item 'battery-monitor/docs/INSTALLATION_MIGRATION.md' $bundle -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'battery-monitor-signed') (Join-Path $bundle 'Firmware') -Recurse -Force

      - name: Verify staged signed application firmware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = Join-Path $env:RUNNER_TEMP 'Battery-Monitor-Windows\Firmware\BatteryMonitor.ino.bin'
          $sig = Join-Path $env:RUNNER_TEMP 'Battery-Monitor-Windows\Firmware\BatteryMonitor.ino.bin.sig'
          dotnet run --project battery-monitor/windows/BatteryMonitor.FirmwareVerifier/BatteryMonitor.FirmwareVerifier.csproj --configuration Release -- "$image" "$sig"

          $tampered = Join-Path $env:RUNNER_TEMP 'tampered-windows.bin'
          Copy-Item $image $tampered -Force
          $bytes = [IO.File]::ReadAllBytes($tampered)
          $bytes[128] = $bytes[128] -bxor 0x01
          [IO.File]::WriteAllBytes($tampered, $bytes)
          dotnet run --project battery-monitor/windows/BatteryMonitor.FirmwareVerifier/BatteryMonitor.FirmwareVerifier.csproj --configuration Release -- --expect-fail "$tampered" "$sig"

      - name: Upload Windows signed-release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Battery-Monitor-Windows-Signed-${{ inputs.version }}
          path: ${{ runner.temp }}/Battery-Monitor-Windows
