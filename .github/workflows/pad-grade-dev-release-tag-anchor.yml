name: Pad Grade Dev Release Tag Anchor

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-android.yml'
      - '.github/workflows/pad-grade-dev-release-tag-anchor.yml'
  workflow_dispatch:

concurrency:
  group: pad-grade-dev-release-tag-anchor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  anchor-dev-release-tag:
    if: github.ref == 'refs/heads/pad-grade-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dev release tag
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' pad-grade-android/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=pad-grade-dev-v$VERSION" >> "$GITHUB_ENV"

      - name: Pre-create release tag on fresh main-equivalent anchor commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists."
            exit 0
          fi

          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          DEFAULT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')
          DEFAULT_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$DEFAULT_SHA" --jq '.tree.sha')

          # GitHub's Releases API may require Workflows:write when it must create
          # a tag at a commit whose .github/workflows tree differs from the
          # default branch. The built-in GITHUB_TOKEN cannot receive that
          # permission. Create a synthetic commit with the exact default-branch
          # tree and parent instead. It changes no files and does not move main,
          # but it has a fresh commit timestamp so GitHub's Releases page sorts
          # new dev releases normally instead of using an old main commit date.
          ANCHOR_SHA=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message="Pad Grade DEV release anchor: $RELEASE_TAG" \
            -f tree="$DEFAULT_TREE" \
            -f "parents[]=$DEFAULT_SHA" \
            --jq '.sha')

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$ANCHOR_SHA"

          echo "ANCHOR_SHA=$ANCHOR_SHA" >> "$GITHUB_ENV"
          echo "DEFAULT_SHA=$DEFAULT_SHA" >> "$GITHUB_ENV"
          echo "DEFAULT_TREE=$DEFAULT_TREE" >> "$GITHUB_ENV"

      - name: Verify anchored tag is fresh and main-equivalent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          DEFAULT_SHA_NOW=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')
          DEFAULT_TREE_NOW=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$DEFAULT_SHA_NOW" --jq '.tree.sha')
          TAG_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$TAG_SHA" --jq '.tree.sha')
          TAG_PARENT=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$TAG_SHA" --jq '.parents[0].sha')

          test "$TAG_TREE" = "$DEFAULT_TREE_NOW"
          test "$TAG_PARENT" = "$DEFAULT_SHA_NOW"
          test "$TAG_SHA" != "$DEFAULT_SHA_NOW"
          echo "$RELEASE_TAG anchored to fresh no-op commit $TAG_SHA over $DEFAULT_BRANCH $DEFAULT_SHA_NOW"

      - name: Pre-create dev prerelease shell from existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          # The tag already exists on a main-equivalent synthetic commit. Do NOT
          # pass --target here: doing so makes GitHub re-evaluate the dev commit's
          # workflow tree and can reject the built-in Actions token with HTTP 403.
          # The Android build later edits these notes and uploads the verified APK.
          gh release create "$RELEASE_TAG" \
            --title "Pad Grade v$APP_VERSION — DEV BUILD" \
            --notes "Pad Grade v$APP_VERSION DEV packaging is in progress. The Android workflow will replace these notes and attach the verified APK." \
            --prerelease

          gh release view "$RELEASE_TAG" --json tagName,isPrerelease --jq '.'
