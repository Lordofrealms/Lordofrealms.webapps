name: Pad Grade v1.1.4 changelog updater

"on":
  push:
    branches:
      - dev/pad-grade-v114-memory-heatfix
    paths:
      - '.github/workflows/pad-grade-v114-changelog-helper2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pad-grade-v114-memory-heatfix
      - run: python scripts/pad-grade-v114-changelog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document Pad Grade v1.1.4 DEV"
          git push origin HEAD:dev/pad-grade-v114-memory-heatfix
