name: Pad Grade v1.4.1 Apply

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - '.github/workflows/pad-grade-v141-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev
          fetch-depth: 0

      - name: Apply v1.4.1 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:120]!r}')
              if text.count(old)!=1:
                  raise SystemExit(f'Patch anchor not unique in {path}: {text.count(old)} matches')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # 1) Diagnostic retention: IndexedDB stays append-style, but retain a much
          # longer field history and prune in batches instead of one row at a time.
          replace_once('pad-grade/v096-diagnostics.js',
              "  const MAX_ENTRIES=2400;\n  const PREBUFFER_MAX=500;",
              "  const MAX_ENTRIES=50000;\n  const PRUNE_TO=48000;\n  const MEMORY_MAX=5000;\n  const PREBUFFER_MAX=500;")
          replace_once('pad-grade/v096-diagnostics.js',
              "  function capArray(arr,max=MAX_ENTRIES){if(arr.length>max)arr.splice(0,arr.length-max);return arr;}",
              "  function capArray(arr,max=MEMORY_MAX){if(arr.length>max)arr.splice(0,arr.length-max);return arr;}")
          replace_once('pad-grade/v096-diagnostics.js',
              "      if(persistedCount>MAX_ENTRIES)await pruneOldest(db,persistedCount-MAX_ENTRIES);",
              "      if(persistedCount>MAX_ENTRIES)await pruneOldest(db,persistedCount-PRUNE_TO);")

          # 2) Permit only the explicit integrity repair transaction to write while
          # the normal recovery mutation lock remains active.
          replace_once('pad-grade/v096-native-async.js',
              "    if(!pendingRecovery)return false;\n    let curtain=false;",
              "    if(!pendingRecovery)return false;\n    if(window.__padGradeIntegrityRepairActive===true)return false;\n    let curtain=false;")

          # Load the integrity barrier after the schema formatter but before the
          # indexed controller. This makes restoration wait for the checker/repairer
          # without adding an arbitrary timer.
          old_loader="""  function loadFormatThenIndex(){
    if(window.PadGradeProjectFormatV107){loadIndexController();return;}
    const existing=document.querySelector('script[data-padgrade-project-format-v107]');
    if(existing){existing.addEventListener('load',loadIndexController,{once:true});return;}
    const script=document.createElement('script');script.src='project-format-v107.js?v=20260830-1';script.async=false;script.dataset.padgradeProjectFormatV107='1';script.onload=loadIndexController;script.onerror=()=>console.error('Pad Grade schema-6 formatter failed to load');
    (document.head||document.documentElement).appendChild(script);
  }
  loadFormatThenIndex();"""
          new_loader="""  function loadIntegrityThenIndex(){
    const proceed=()=>{
      try{
        const pending=window.PadGradeProjectIntegrityV141?.beforeIndexController?.();
        if(pending&&typeof pending.then==='function'){
          pending.then(loadIndexController,error=>{console.error('Pad Grade v1.4.1 integrity barrier failed',error);loadIndexController();});
          return;
        }
      }catch(error){console.error('Pad Grade v1.4.1 integrity barrier failed',error);}
      loadIndexController();
    };
    if(window.PadGradeProjectIntegrityV141){proceed();return;}
    const existing=document.querySelector('script[data-padgrade-v141-storage-integrity]');
    if(existing){existing.addEventListener('load',proceed,{once:true});return;}
    const script=document.createElement('script');script.src='v141-storage-integrity.js?v=20260902-1';script.async=false;script.dataset.padgradeV141StorageIntegrity='1';script.onload=proceed;script.onerror=()=>{console.error('Pad Grade v1.4.1 storage integrity module failed to load');loadIndexController();};
    (document.head||document.documentElement).appendChild(script);
  }
  function loadFormatThenIndex(){
    if(window.PadGradeProjectFormatV107){loadIntegrityThenIndex();return;}
    const existing=document.querySelector('script[data-padgrade-project-format-v107]');
    if(existing){existing.addEventListener('load',loadIntegrityThenIndex,{once:true});return;}
    const script=document.createElement('script');script.src='project-format-v107.js?v=20260830-1';script.async=false;script.dataset.padgradeProjectFormatV107='1';script.onload=loadIntegrityThenIndex;script.onerror=()=>console.error('Pad Grade schema-6 formatter failed to load');
    (document.head||document.documentElement).appendChild(script);
  }
  loadFormatThenIndex();"""
          replace_once('pad-grade/v096-native-async.js',old_loader,new_loader)

          # 3) Kill the stale producer state itself on a successful project switch.
          # The existing worker cancellation remains authoritative; this clears the
          # completed-canvas reference that the 900 ms maintenance loop otherwise
