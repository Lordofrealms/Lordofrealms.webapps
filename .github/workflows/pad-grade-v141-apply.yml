          replace_once('pad-grade-android/app/build.gradle.kts',
              "        // v1.3.8 field-build trigger: picker-cover ownership handoff only.\n        versionCode = 110\n        versionName = \"1.3.8\"",
              "        // v1.4.1 DEV: durable identity repair, extended diagnostics, stale heat retirement.\n        versionCode = 112\n        versionName = \"1.4.1\"")

          storage = r'''/* Pad Grade v1.4.1 DEV — persistent project/file identity integrity barrier.
 *
 * Runs before the v1.0.7 indexed controller is allowed to restore the durable
 * directory. Unchanged schema-6 projects need only their bounded headers. Full
 * project bodies are read only for headerless legacy files or actual collisions.
 *
 * Repair is conservative: newest duplicate keeps the existing identity; every
 * other colliding project is written to a new canonical filename first, then the
 * old file is deleted. If deletion fails, the new write is rolled back. The
 * rebuildable .pgindex is invalidated after a successful repair so the existing
 * index controller reconstructs it from authoritative project files.
