name: Pad Grade v1.4.1 Apply

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - '.github/workflows/pad-grade-v141-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev
          fetch-depth: 0

      - name: Apply v1.4.1 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, got {text.count(old)} for {old[:80]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('pad-grade/v096-diagnostics.js',
              "  const MAX_ENTRIES=2400;\n  const PREBUFFER_MAX=500;",
              "  const MAX_ENTRIES=50000;\n  const PRUNE_TO=48000;\n  const MEMORY_MAX=5000;\n  const PREBUFFER_MAX=500;")
          replace_once('pad-grade/v096-diagnostics.js',
              "  function capArray(arr,max=MAX_ENTRIES){if(arr.length>max)arr.splice(0,arr.length-max);return arr;}",
              "  function capArray(arr,max=MEMORY_MAX){if(arr.length>max)arr.splice(0,arr.length-max);return arr;}")
          replace_once('pad-grade/v096-diagnostics.js',
              "      if(persistedCount>MAX_ENTRIES)await pruneOldest(db,persistedCount-MAX_ENTRIES);",
              "      if(persistedCount>MAX_ENTRIES)await pruneOldest(db,persistedCount-PRUNE_TO);")

          replace_once('pad-grade/v096-native-async.js',
              "    if(!pendingRecovery)return false;\n    let curtain=false;",
              "    if(!pendingRecovery)return false;\n    if(window.__padGradeIntegrityRepairActive===true)return false;\n    let curtain=false;")

          old_loader=(
              "  function loadFormatThenIndex(){\n"
              "    if(window.PadGradeProjectFormatV107){loadIndexController();return;}\n"
              "    const existing=document.querySelector('script[data-padgrade-project-format-v107]');\n"
              "    if(existing){existing.addEventListener('load',loadIndexController,{once:true});return;}\n"
              "    const script=document.createElement('script');script.src='project-format-v107.js?v=20260830-1';script.async=false;script.dataset.padgradeProjectFormatV107='1';script.onload=loadIndexController;script.onerror=()=>console.error('Pad Grade schema-6 formatter failed to load');\n"
              "    (document.head||document.documentElement).appendChild(script);\n"
              "  }\n"
              "  loadFormatThenIndex();")
          new_loader=(
              "  function loadIntegrityThenIndex(){\n"
              "    const proceed=()=>{\n"
              "      try{\n"
              "        const pending=window.PadGradeProjectIntegrityV141?.beforeIndexController?.();\n"
              "        if(pending&&typeof pending.then==='function'){pending.then(loadIndexController,error=>{console.error('Pad Grade v1.4.1 integrity barrier failed',error);loadIndexController();});return;}\n"
              "      }catch(error){console.error('Pad Grade v1.4.1 integrity barrier failed',error);}\n"
              "      loadIndexController();\n"
              "    };\n"
              "    if(window.PadGradeProjectIntegrityV141){proceed();return;}\n"
              "    const existing=document.querySelector('script[data-padgrade-v141-storage-integrity]');\n"
              "    if(existing){existing.addEventListener('load',proceed,{once:true});return;}\n"
              "    const script=document.createElement('script');script.src='v141-storage-integrity.js?v=20260902-1';script.async=false;script.dataset.padgradeV141StorageIntegrity='1';script.onload=proceed;script.onerror=()=>{console.error('Pad Grade v1.4.1 storage integrity module failed to load');loadIndexController();};\n"
              "    (document.head||document.documentElement).appendChild(script);\n"
              "  }\n"
              "  function loadFormatThenIndex(){\n"
              "    if(window.PadGradeProjectFormatV107){loadIntegrityThenIndex();return;}\n"
              "    const existing=document.querySelector('script[data-padgrade-project-format-v107]');\n"
              "    if(existing){existing.addEventListener('load',loadIntegrityThenIndex,{once:true});return;}\n"
              "    const script=document.createElement('script');script.src='project-format-v107.js?v=20260830-1';script.async=false;script.dataset.padgradeProjectFormatV107='1';script.onload=loadIntegrityThenIndex;script.onerror=()=>console.error('Pad Grade schema-6 formatter failed to load');\n"
              "    (document.head||document.documentElement).appendChild(script);\n"
              "  }\n"
              "  loadFormatThenIndex();")
          replace_once('pad-grade/v096-native-async.js',old_loader,new_loader)

          replace_once('pad-grade/v063-dev.js',
              "    window.addEventListener('padgrade-active-project-applied',()=>setTimeout(syncSurface,0));\n    syncTimer=setInterval(()=>{installMapClick();syncSurface();syncLaserMarker();},900);",
              "    window.addEventListener('padgrade-before-project-switch',()=>{removeRaster();try{window.PadGradeDiag?.mark?.('heatmap.v141-outgoing-producer-retired',{displayedCanvasCleared:true,workerStateCleared:true,maintenanceLoopPreserved:true});}catch(e){}});\n    window.addEventListener('padgrade-active-project-applied',()=>setTimeout(syncSurface,0));\n    syncTimer=setInterval(()=>{installMapClick();syncSurface();syncLaserMarker();},900);")

          replace_once('pad-grade/index.html','<title>Pad Grade Mapper v1.3.8 DEV</title>','<title>Pad Grade Mapper v1.4.1 DEV</title>')
          replace_once('pad-grade-android/app/build.gradle.kts',
              "        // v1.3.8 field-build trigger: picker-cover ownership handoff only.\n        versionCode = 110\n        versionName = \"1.3.8\"",
              "        // v1.4.1 DEV: durable identity repair, extended diagnostics, stale heat retirement.\n        versionCode = 112\n        versionName = \"1.4.1\"")

          replace_once('pad-grade/dev-selftest.js',
              "console.log('Pad Grade dev self-test PASS');",
              "require('child_process').execFileSync(process.execPath,[path.join(root,'v141-storage-integrity-selftest.js')],{stdio:'inherit'});\nconsole.log('Pad Grade dev self-test PASS');")

          notes_lines=[
              '# Pad Grade Mapper v1.4.1 — DEV BUILD','',
              '## v1.4.1 — project identity repair and cleaner project switching','',
              'v1.4.1 is a focused reliability build following the v1.4.0 stable promotion. Heatmap interpolation, progressive 99 / 297 / 891 computation, atomic complete-frame presentation, grading math, and imagery quality are unchanged.','',
              '### Fixed — duplicate project identities in the persistent folder','',
              'On persistent-directory restoration, Pad Grade now checks project IDs and six-character file IDs before the indexed project controller is allowed to restore a project.','',
              '- Duplicate project IDs are repaired automatically.','- Duplicate file IDs are repaired automatically.','- The newest colliding project keeps the existing identity; older colliding files receive new unique identities.','- Repairs are write-first/delete-second so an original file is not removed until its repaired replacement is safely written.','- If cleanup of the old file fails, the replacement is rolled back rather than silently creating an ambiguous second copy.','- A repaired duplicate project invalidates the shared old-ID heat cache, and the rebuildable project index is invalidated so it is reconstructed from the repaired authoritative files.','- Normal recovery writes remain locked; only the explicit integrity-repair transaction can write during this pre-restore check.','',
              '### Fixed — stale heat work after a project switch','',
              'The old heat workers were already being terminated, but the older heat producer still retained its last completed canvas. Its 900 ms maintenance pass could therefore keep trying to restore that dead canvas after a switch.','',
              'v1.4.1 clears that producer state at the existing project-switch boundary. The old workers, pending rasters, completed canvas reference, slot ownership, and old surface key are retired before the new project is applied. The maintenance loop itself remains available for the new project.','',
              'This does not wait for the new heatmap before returning to the map and does not change the no-flicker complete-frame presenter.','',
              '### Diagnostics','',
              '- Persistent diagnostic retention increases from 2,400 to **50,000 entries**.','- IndexedDB remains append-based.','- Once the log exceeds 50,000 entries it prunes back to 48,000 in a batch, avoiding continuous one-entry pruning at the cap.','- The emergency in-memory fallback remains smaller so a storage failure cannot consume excessive RAM.','',
              '### Version','', '- Android DEV version: **1.4.1**','- build: **112**','- application ID: `com.lordofrealms.padgrade.dev`','']
          Path('pad-grade/RELEASE_NOTES.md').write_text('\n'.join(notes_lines),encoding='utf-8')

          entry='\n'.join([
              '## v1.4.1 DEV / build 112 — durable identity repair, 50k diagnostics, stale heat producer retirement','',
              '- Added a pre-index persistent-directory integrity barrier that checks duplicate project IDs and six-character file IDs before durable restoration.',
              '- Repairs collisions conservatively with newest-owner retention, write-first/delete-second replacement, rollback on cleanup failure, heat-cache invalidation for repaired shared project IDs, and project-index invalidation for clean rebuild.',
              '- Preserved the normal recovery mutation lock; only the explicit integrity transaction can bypass it.',
              '- Increased IndexedDB diagnostic retention to 50,000 entries with batch prune-back to 48,000; memory fallback remains bounded at 5,000.',
              '- Fixed recurring stale heat restoration attempts by clearing the v1.1.1 producer completed-canvas/generation state on `padgrade-before-project-switch`; existing v1.2.6/v1.2.7 physical worker cancellation remains intact.',
              '- Heat interpolation, 99/297/891 progressive computation, parallel band math, atomic complete-frame presentation, imagery, grading math, and map reveal timing are unchanged.','',''])
          for name in ('pad-grade/CHANGELOG.md','pad-grade-android/CHANGELOG.md'):
              p=Path(name);p.write_text(entry+p.read_text(encoding='utf-8'),encoding='utf-8')
          PY

      - name: Validate v1.4.1 regression
        run: |
          node --check pad-grade/v141-storage-integrity.js
          node --check pad-grade/v141-storage-integrity-selftest.js
          node --check pad-grade/v096-diagnostics.js
          node --check pad-grade/v096-native-async.js
          node --check pad-grade/v063-dev.js
          node pad-grade/dev-selftest.js
          grep -F 'versionCode = 112' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.4.1"' pad-grade-android/app/build.gradle.kts
          grep -F '<title>Pad Grade Mapper v1.4.1 DEV</title>' pad-grade/index.html
          grep -F 'const MAX_ENTRIES=50000;' pad-grade/v096-diagnostics.js
          grep -F "padgrade-before-project-switch',()=>{removeRaster()" pad-grade/v063-dev.js

      - name: Commit v1.4.1 DEV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pad-grade pad-grade-android
          git diff --cached --check
          git commit -m 'Pad Grade v1.4.1: repair identities and retire stale heat state'
          git push origin HEAD:pad-grade-dev
