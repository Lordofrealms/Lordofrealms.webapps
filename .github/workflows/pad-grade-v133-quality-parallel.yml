name: Pad Grade v1.3.3 Quality + Parallel Gate

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/heatmap-raster-worker-v133.js'
      - 'pad-grade/heatmap-raster-band-worker-v133.js'
      - 'pad-grade/v132-worker-bootstrap-fix.js'
      - 'pad-grade/v132-imagery-quality.js'
      - 'pad-grade/v133-parallel-selftest.js'
      - 'pad-grade/v133-imagery-best-selftest.js'
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-v133-quality-parallel.yml'
  pull_request:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/heatmap-raster-worker-v133.js'
      - 'pad-grade/heatmap-raster-band-worker-v133.js'
      - 'pad-grade/v132-worker-bootstrap-fix.js'
      - 'pad-grade/v132-imagery-quality.js'
      - 'pad-grade/v133-parallel-selftest.js'
      - 'pad-grade/v133-imagery-best-selftest.js'
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-v133-quality-parallel.yml'
  workflow_dispatch:

concurrency:
  group: pad-grade-v133-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v133:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate v1.3.3 scripts
        run: |
          node --check pad-grade/heatmap-raster-worker-v133.js
          node --check pad-grade/heatmap-raster-band-worker-v133.js
          node --check pad-grade/v132-worker-bootstrap-fix.js
          node --check pad-grade/v132-imagery-quality.js
          node --check pad-grade/v133-parallel-selftest.js
          node --check pad-grade/v133-imagery-best-selftest.js

      - name: Run v1.3.3 regressions
        run: |
          node pad-grade/v133-parallel-selftest.js
          node pad-grade/v133-imagery-best-selftest.js

      - name: Verify atomic parallel heat invariants
        run: |
          grep -F "TARGET='heatmap-raster-worker-v133.js?v=20260901-1'" pad-grade/v132-worker-bootstrap-fix.js
          grep -F "heatmap-raster-band-worker-v133.js?v=20260901-1" pad-grade/heatmap-raster-worker-v133.js
          grep -F "childWorkerKind:'dedicated-v133'" pad-grade/heatmap-raster-worker-v133.js
          grep -F 'partialFramesPublished:0' pad-grade/heatmap-raster-worker-v133.js
          grep -F 'bandFramesPublished:0' pad-grade/heatmap-raster-worker-v133.js
          grep -F 'coordinator.remaining>0)return' pad-grade/heatmap-raster-worker-v133.js
          grep -F "type:'band-complete'" pad-grade/heatmap-raster-band-worker-v133.js
          ! grep -F 'new Worker(' pad-grade/heatmap-raster-band-worker-v133.js

      - name: Verify best-available USGS imagery invariants
        run: |
          grep -F "sortField:'resolution_value'" pad-grade/v132-imagery-quality.js
          grep -F 'sortValue:0' pad-grade/v132-imagery-quality.js
          grep -F "mosaicOperation:'MT_FIRST'" pad-grade/v132-imagery-quality.js
          grep -F "const INTERPOLATION='RSP_CubicConvolution'" pad-grade/v132-imagery-quality.js
          grep -F 'const EXPORT_SIZE=512' pad-grade/v132-imagery-quality.js
          grep -F 'const COMPRESSION_QUALITY=95' pad-grade/v132-imagery-quality.js
          grep -F 'noEsriProvider:true' pad-grade/v132-imagery-quality.js
          grep -F 'noLocalCoverageHardcode:true' pad-grade/v132-imagery-quality.js

      - name: Verify version and detailed release notes
        run: |
          grep -F 'versionCode = 105' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.3.3"' pad-grade-android/app/build.gradle.kts
          grep -F '# Pad Grade Mapper v1.3.3 — DEV BUILD' pad-grade/RELEASE_NOTES.md
          grep -F '## v1.3.3 —' pad-grade/RELEASE_NOTES.md
          grep -F 'no row painting, no partial heatmap frames, no flicker regression' pad-grade/RELEASE_NOTES.md
