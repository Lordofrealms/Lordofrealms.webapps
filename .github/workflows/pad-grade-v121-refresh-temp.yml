name: Pad Grade v1.2.1 Temporary Release Refresh

on:
  push:
    branches: [pad-grade-dev-v121-image-request-dedupe]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v121-image-request-dedupe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh release metadata
        run: python3 refresh_v121_release.py
      - name: Verify v1.2.1 regression
        run: |
          node --check pad-grade/v121-dev.js
          node pad-grade/v121-image-request-selftest.js
          grep -F '<title>Pad Grade Mapper v1.2.1 DEV</title>' pad-grade/index.html
          grep -F 'src="v121-dev.js?v=20260831-1' pad-grade/index.html
          grep -F 'versionCode = 93' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.2.1"' pad-grade-android/app/build.gradle.kts
      - name: Commit refreshed files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pad-grade/index.html pad-grade/CHANGELOG.md pad-grade-android/CHANGELOG.md
          git commit -m 'Wire Pad Grade v1.2.1 DEV release metadata'
          git push origin HEAD:pad-grade-dev-v121-image-request-dedupe
