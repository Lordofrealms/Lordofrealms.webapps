name: Pad Grade v1.1.4 authority repair

"on":
  push:
    branches:
      - dev/pad-grade-v114-memory-heatfix
    paths:
      - '.github/workflows/pad-grade-v114-authority-fix-helper2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pad-grade-v114-memory-heatfix
      - run: python scripts/pad-grade-v114-authority-fix.py
      - run: node --check pad-grade/v114-dev.js
      - run: node pad-grade/v114-heat-memory-selftest.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Pad Grade v1.1.4 heat authority selection"
          git push origin HEAD:dev/pad-grade-v114-memory-heatfix
