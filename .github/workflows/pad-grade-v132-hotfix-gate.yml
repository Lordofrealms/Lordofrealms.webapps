name: Pad Grade v1.3.2 Carry-Forward Gate

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v132-worker-bootstrap-fix.js'
      - 'pad-grade/v132-imagery-quality.js'
      - 'pad-grade/index.html'
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-v132-hotfix-gate.yml'
  pull_request:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v132-worker-bootstrap-fix.js'
      - 'pad-grade/v132-imagery-quality.js'
      - 'pad-grade/index.html'
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-v132-hotfix-gate.yml'
  workflow_dispatch:

jobs:
  verify-v132-carry-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate carry-forward scripts
        run: |
          node --check pad-grade/v132-worker-bootstrap-fix.js
          node --check pad-grade/v132-imagery-quality.js
      - name: Preserve v1.3.2 architectural fixes
        run: |
          grep -F 'Reflect.construct(NativeParent,args,new.target||PadGrade133WorkerBootstrap)' pad-grade/v132-worker-bootstrap-fix.js
          grep -F '__padGradeV132WorkerBootstrapFix=true' pad-grade/v132-worker-bootstrap-fix.js
          grep -F 'const EXPORT_SIZE=512' pad-grade/v132-imagery-quality.js
          grep -F 'const COMPRESSION_QUALITY=95' pad-grade/v132-imagery-quality.js
          grep -F 'providerUnchanged:true' pad-grade/v132-imagery-quality.js
          grep -F 'naturalColorUnchanged:true' pad-grade/v132-imagery-quality.js
