name: Pad Grade v1.3.8 Release Repair

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - '.github/workflows/pad-grade-v138-release-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: pad-grade-dev-v1.3.8
      VERSION: 1.3.8
      ARTIFACT_ID: '9827256516'
      APK_NAME: Pad-Grade-v1.3.8.apk
    steps:
      - uses: actions/checkout@v4

      - name: Verify pre-created release tag
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha'

      - name: Download already-verified Android artifact
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/pad-grade-v138.zip
          mkdir -p /tmp/pad-grade-v138
          unzip -q /tmp/pad-grade-v138.zip -d /tmp/pad-grade-v138
          test -s "/tmp/pad-grade-v138/$APK_NAME"
          sha256sum "/tmp/pad-grade-v138/$APK_NAME"
          test "$(sha256sum "/tmp/pad-grade-v138/$APK_NAME" | awk '{print $1}')" = "830817d0eeffaebc832c1092b244760e951c66ef71f524dc3797378fc0221267"

      - name: Build v1.3.8 release notes only
        run: |
          python3 - "$VERSION" /tmp/pad-grade-release-notes.md <<'PY'
          import re, sys
          from pathlib import Path
          version,out=sys.argv[1:]
          text=Path('pad-grade/RELEASE_NOTES.md').read_text(encoding='utf-8')
          title=re.search(rf'^# Pad Grade Mapper v{re.escape(version)}(?:\s+—.*)?$', text, re.M)
          section=re.search(rf'^## v{re.escape(version)}(?:\s+—.*)?$', text, re.M)
          if not title or not section or section.start() < title.start():
              raise SystemExit(f'Could not locate current v{version} release notes')
          end=len(text)
          separator=re.search(r'^---\s*$', text[section.end():], re.M)
          next_title=re.search(r'^# Pad Grade Mapper v[0-9]+\.[0-9]+\.[0-9]+(?:\s+—.*)?$', text[section.end():], re.M)
          candidates=[]
          if separator: candidates.append(section.end()+separator.start())
          if next_title: candidates.append(section.end()+next_title.start())
          if candidates: end=min(candidates)
          current=text[title.start():end].rstrip()+'\n'
          Path(out).write_text(current, encoding='utf-8')
          PY

      - name: Publish prerelease from existing tag without target commit
        run: |
          APK="/tmp/pad-grade-v138/$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Pad Grade v$VERSION — DEV BUILD" --notes-file /tmp/pad-grade-release-notes.md --prerelease
            gh release upload "$TAG" "$APK" --clobber
          else
            # TAG already exists and points at the synthetic main-equivalent anchor.
            # Deliberately omit --target so GitHub does not re-evaluate the dev
            # workflow-bearing commit and reject the built-in Actions token.
            gh release create "$TAG" "$APK" --title "Pad Grade v$VERSION — DEV BUILD" --notes-file /tmp/pad-grade-release-notes.md --prerelease
          fi

      - name: Verify published prerelease and APK
        run: |
          gh release view "$TAG" --json tagName,name,isPrerelease,assets --jq '.'
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "true"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
