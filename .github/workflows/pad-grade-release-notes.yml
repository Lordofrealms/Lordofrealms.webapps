name: Pad Grade Release Notes

"on":
  push:
    branches:
      - pad-grade-dev
    paths:
      - '.github/workflows/pad-grade-release-notes.yml'

permissions:
  contents: write

jobs:
  repair-v112:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair changelogs and prepare release notes
        run: python3 .github/scripts/repair_pad_grade_v112_docs.py

      - name: Commit documentation repair
        run: |
          git rm .github/scripts/repair_pad_grade_v112_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pad-grade/CHANGELOG.md pad-grade-android/CHANGELOG.md .github/workflows/pad-grade-release-notes.yml
          git diff --cached --check
          git commit -m 'Document Pad Grade v1.1.2 release [skip ci]'
          git push origin HEAD:pad-grade-dev

      - name: Publish corrected v1.1.2 prerelease description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit pad-grade-dev-v1.1.2 --notes-file /tmp/pad-grade-v112-release-notes.md --prerelease
          gh release view pad-grade-dev-v1.1.2 --json body --jq '.body' | grep -F '## v1.1.2 — development build'
          gh release view pad-grade-dev-v1.1.2 --json body --jq '.body' | grep -F 'DEV heat-map resolution inspector'
