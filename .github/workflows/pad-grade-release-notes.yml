name: Pad Grade Release Notes

on:
  push:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and channel
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' pad-grade-android/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            CHANNEL=stable
            RELEASE_TAG="pad-grade-v$VERSION"
          elif [ "$BRANCH" = "pad-grade-dev" ]; then
            CHANNEL=dev
            RELEASE_TAG="pad-grade-dev-v$VERSION"
          else
            echo "Unsupported branch: $BRANCH" >&2
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify release notes match app version
        run: |
          python3 - "$APP_VERSION" <<'PY'
          import re, sys
          from pathlib import Path
          version=sys.argv[1]
          text=Path('pad-grade/RELEASE_NOTES.md').read_text(encoding='utf-8')
          if not re.search(rf'^# Pad Grade Mapper v{re.escape(version)}(?:\s+—.*)?$', text, re.M):
              raise SystemExit(f'RELEASE_NOTES.md title does not match v{version}')
          if not re.search(rf'^## v{re.escape(version)}(?:\s+—.*)?$', text, re.M):
              raise SystemExit(f'RELEASE_NOTES.md is missing the v{version} change section')
          PY

      - name: Wait for current GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=0
          for _ in $(seq 1 120); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              found=1
              break
            fi
            sleep 3
          done
          if [ "$found" != "1" ]; then
            echo "Timed out waiting for GitHub release $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build detailed release notes
        run: cp pad-grade/RELEASE_NOTES.md /tmp/pad-grade-release-notes.md

      - name: Publish detailed current release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BUILD_CHANNEL" = "dev" ]; then
            gh release edit "$RELEASE_TAG" --notes-file /tmp/pad-grade-release-notes.md --prerelease
          else
            gh release edit "$RELEASE_TAG" --notes-file /tmp/pad-grade-release-notes.md
          fi

      - name: Repair v0.9.9 DEV release notes
        if: env.BUILD_CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view pad-grade-dev-v0.9.9 >/dev/null 2>&1; then
            exit 0
          fi
          python3 - 0.9.9 dev /tmp/pad-grade-release-notes-099.md <<'PY'
          import re, sys
          from pathlib import Path
          version,channel,out=sys.argv[1:]
          lines=Path('pad-grade/CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          start=None
          for i,line in enumerate(lines):
              if re.fullmatch(rf'## v{re.escape(version)}(?:\s+—.*)?', line):
                  start=i; break
          if start is None:
              raise SystemExit(f'Missing changelog section for v{version}')
          end=len(lines)
          for i in range(start+1,len(lines)):
              if lines[i].startswith('## '): end=i; break
          section='\n'.join(lines[start:end]).rstrip()+'\n'
          intro=(
              '# Pad Grade Mapper\n\n'
              'Android grading and survey-planning tool for recording rod readings on a configurable pad grid, visualizing cut/fill with interpolation and heat maps, estimating earthwork, navigating survey points with GPS, and managing portable project saves with import/export and durable-folder storage.\n\n'
              '**Development / test build** — installs separately from the stable app and may contain experimental changes.\n\n'
              '# Changes in this build\n\n'
          )
          Path(out).write_text(intro+section,encoding='utf-8')
          PY
          gh release edit pad-grade-dev-v0.9.9 --notes-file /tmp/pad-grade-release-notes-099.md --prerelease

      - name: Verify detailed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq '.body' | grep -F "# Pad Grade Mapper v$APP_VERSION"
          gh release view "$RELEASE_TAG" --json body --jq '.body' | grep -F "## v$APP_VERSION"
          if [ "$BUILD_CHANNEL" = "dev" ] && gh release view pad-grade-dev-v0.9.9 >/dev/null 2>&1; then
            gh release view pad-grade-dev-v0.9.9 --json body --jq '.body' | grep -F '## v0.9.9'
          fi
