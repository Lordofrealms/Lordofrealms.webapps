name: Apply Pad Grade v1.3.7 Dev

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/tools/apply-v137.py'

permissions:
  contents: write

jobs:
  apply-v137:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev
          fetch-depth: 0

      - name: Apply v1.3.7 source update
        run: python3 pad-grade/tools/apply-v137.py

      - name: Validate v1.3.7 source update
        run: |
          python3 pad-grade/pad-grade-v137-imagery-selection-selftest.py
          node --check pad-grade/v136-imagery-resolution-diagnostics.js
          node --check pad-grade/v130-lifecycle-imagery.js

      - name: Commit generated v1.3.7 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pad-grade pad-grade-android
          if git diff --cached --quiet; then
            echo 'No v1.3.7 changes to commit.'
            exit 0
          fi
          git commit -m 'Pad Grade v1.3.7: prefer best resolved USGS imagery'
          git push origin HEAD:pad-grade-dev
