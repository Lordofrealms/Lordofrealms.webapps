name: Pad Grade v1.1.3 Reuse Cache

"on":
  pull_request:
    branches: [pad-grade-dev, main]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-v113-reuse-cache.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and retained heat tests
        run: |
          node --check pad-grade/v062-dev.js
          node --check pad-grade/v113-dev.js
          node pad-grade/v110-staged-heat-selftest.js
          node pad-grade/v111-resilience-selftest.js
      - name: Verify retained v1.1.3 policies in current DEV
        run: |
          grep -E 'versionCode = [0-9]+' pad-grade-android/app/build.gradle.kts
          grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' pad-grade-android/app/build.gradle.kts
          grep -F 'v113-dev.js?v=20260830-1' pad-grade/index.html
          grep -F 'auto-or-exact-single-raster-99-297-891-no-crossfade' pad-grade/v113-dev.js
          grep -F 'stage-new-hide-old-same-task-zero-fade-no-overlap-frame' pad-grade/v113-dev.js
          grep -F 'lossless-png-final-891-per-project-surface-key-active-hit-suppresses-recalc' pad-grade/v113-dev.js
          grep -F 'onRenderProcessGone(WebView view' pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java
          grep -F 'activity.onCreate' pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java
          grep -F 'class PadGradeLifecycleBridge' pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeLifecycleBridge.java
          grep -F '## v1.1.3 — development build' pad-grade/CHANGELOG.md
          grep -F '## v1.1.3 — development build' pad-grade-android/CHANGELOG.md
          ! grep -F 'Pad Grade v1.1.2 DEV diagnostic — resolution inspector' pad-grade/v062-dev.js
          ! grep -F 'stampMeasuredPointAnchors' pad-grade/heatmap-raster-worker-v073.js
