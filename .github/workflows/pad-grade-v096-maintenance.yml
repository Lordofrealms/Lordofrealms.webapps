name: Pad Grade v0.9.6 Maintenance Patch

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - '.github/workflows/pad-grade-v096-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev
          fetch-depth: 0

      - name: Apply v0.9.6 async durability hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          java = 'pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java'
          replace_once(
              java,
              '    @JavascriptInterface public boolean hasProjectFolder() { return getProjectFolder() != null; }\n',
              '    @JavascriptInterface public boolean hasProjectFolder() { return getProjectFolder() != null; }\n'
              '    /** Cheap v0.9.6 startup probe: reports a configured folder URI without querying the SAF provider. */\n'
              '    @JavascriptInterface public boolean hasProjectFolderConfigured() {\n'
              '        String raw = activity.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(PROJECT_FOLDER_URI, null);\n'
              '        return raw != null && !raw.isBlank();\n'
              '    }\n'
          )
          replace_once(
              java,
              '                if (name == null || file == null || !file.isFile()) continue;\n',
              '                // The directory walk already populated this cache on the background index thread.\n'
              '                // Do not call DocumentFile.isFile() here: TreeDocumentFile may query the provider again,\n'
              '                // turning a cached JS list request into one synchronous SAF query per entry.\n'
              '                if (name == null || file == null) continue;\n'
          )

          reconcile = 'pad-grade/v096-async-reconcile.js'
          replace_once(
              reconcile,
              "  function hasFolder(){try{return typeof native.hasProjectFolder==='function'&&!!native.hasProjectFolder();}catch(e){return false;}}\n",
              "  function hasFolder(){try{if(typeof native.hasProjectFolderConfigured==='function')return !!native.hasProjectFolderConfigured();return typeof native.hasProjectFolder==='function'&&!!native.hasProjectFolder();}catch(e){return false;}}\n"
          )
          replace_once(
              reconcile,
              "  window.addEventListener('padgrade-project-folder-indexed',()=>prepareMinimumRecovery());\n",
              "  window.addEventListener('padgrade-project-folder-indexed',()=>{\n"
              "    if(indexReady()){prepareMinimumRecovery();return;}\n"
              "    // An inaccessible configured URI must not leave recovery pending forever.\n"
              "    try{native.completeProjectFolderRecovery?.();}catch(e){}\n"
              "    const result={ready:false,indexUnavailable:true};window.__padGradeMinimumDurableRecoveryV096=result;\n"
              "    try{window.dispatchEvent(new CustomEvent('padgrade-minimum-durable-recovery-ready',{detail:result}));}catch(e){}\n"
              "    diag()?.mark?.('recovery.index-unavailable',result);\n"
              "  });\n"
          )

          diag = 'pad-grade/v096-diagnostics.js'
          replace_once(
              diag,
              "  function persistEntries(entries){try{localStorage.setItem(LOG_KEY,JSON.stringify(trim(entries)));}catch(e){}\n  function record(name,durationMs,details,kind='mark'){\n",
              "  function persistEntries(entries){try{localStorage.setItem(LOG_KEY,JSON.stringify(trim(entries)));}catch(e){}}\n  function record(name,durationMs,details,kind='mark'){\n"
          )
          PY

      - name: Validate patched JavaScript
        run: |
          node --check pad-grade/v096-diagnostics.js
          node --check pad-grade/v096-dev-defaults.js
          node --check pad-grade/v096-native-async.js
          node --check pad-grade/v096-async-reconcile.js

      - name: Commit code hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeNativeBridge.java pad-grade/v096-async-reconcile.js pad-grade/v096-diagnostics.js
          git diff --cached --check
          git commit -m "Pad Grade v0.9.6: finish async durability hardening"
          git push origin HEAD:pad-grade-dev
