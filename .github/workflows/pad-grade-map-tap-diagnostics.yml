name: Pad Grade Fixed Map Hitbox

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v106-map-hitbox.js'
      - 'pad-grade/index.html'
      - 'pad-grade/CHANGELOG.md'
      - 'pad-grade-android/CHANGELOG.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-map-tap-diagnostics.yml'
  pull_request:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v106-map-hitbox.js'
      - 'pad-grade/index.html'
      - 'pad-grade/CHANGELOG.md'
      - 'pad-grade-android/CHANGELOG.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-map-tap-diagnostics.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check fixed map hitbox module
        run: node --check pad-grade/v106-map-hitbox.js

      - name: Verify fixed 15 percent safe hitboxes remain unchanged
        run: |
          grep -F 'v106-map-hitbox.js?v=20260830-1' pad-grade/index.html
          ! grep -F 'v104-map-tap-diagnostics.js' pad-grade/index.html
          ! grep -F 'v105-map-hitbox.js' pad-grade/index.html
          grep -F "const HITBOX_PADDING_PCT=15" pad-grade/v106-map-hitbox.js
          grep -F 'const TOTAL_RADIUS_CAP=0.45' pad-grade/v106-map-hitbox.js
          grep -F "if(matches.length!==1)return" pad-grade/v106-map-hitbox.js
          grep -F 'directRenderedPointHit' pad-grade/v106-map-hitbox.js
          grep -F 'probeModeActive' pad-grade/v106-map-hitbox.js
          grep -F 'fixed-15pct-visible-circle-plus-spacing-padding-capped-45pct-deadspace-no-nearest-fallback' pad-grade/v106-map-hitbox.js
          ! grep -F 'mapGridHitboxPaddingPct' pad-grade/v106-map-hitbox.js
          ! grep -F 'MapTapDiagnostics' pad-grade/v106-map-hitbox.js
          grep -F '## v1.0.6 — development build' pad-grade/CHANGELOG.md
          grep -F 'fixed **15% of projected point-to-point spacing**' pad-grade/CHANGELOG.md
          grep -F '## v1.0.3 — withdrawn development build' pad-grade/CHANGELOG.md
          grep -F '## v1.0.6 — development build' pad-grade-android/CHANGELOG.md

      - name: Confirm current candidate advances version without changing hitbox policy
        run: |
          grep -E 'Pad Grade Mapper v[0-9]+\.[0-9]+\.[0-9]+ DEV' pad-grade/index.html
          grep -E 'versionCode = (7[8-9]|[89][0-9]|[1-9][0-9]{2,})' pad-grade-android/app/build.gradle.kts
          grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' pad-grade-android/app/build.gradle.kts

      - name: Confirm lower measurement grid remains untouched
        run: |
          ! grep -F 'v103-grid-hitbox-fix' pad-grade/index.html
          ! test -f pad-grade/v103-grid-hitbox-fix.js
