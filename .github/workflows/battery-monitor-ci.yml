name: Battery Monitor Toolchain

on:
  push:
    branches: [battery-monitor-dev, main]
    paths:
      - 'battery-monitor/firmware/**'
      - 'battery-monitor/windows/**'
      - 'battery-monitor/android/**'
      - 'battery-monitor/signing/**'
      - '.github/workflows/battery-monitor-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'battery-monitor/firmware/**'
      - 'battery-monitor/windows/**'
      - 'battery-monitor/android/**'
      - 'battery-monitor/signing/**'
      - '.github/workflows/battery-monitor-ci.yml'
  workflow_dispatch:

concurrency:
  group: battery-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP32 ESP-IDF + Arduino firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned ESP-IDF 5.5.5
        shell: bash
        run: |
          set -euo pipefail
          idf="$RUNNER_TEMP/esp-idf"
          commit='b774170ff46c393eeb5e495ea37936038d3f4f4f'
          mkdir -p "$idf"
          git -C "$idf" init
          git -C "$idf" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$idf" fetch --depth=1 origin "$commit"
          git -C "$idf" checkout --detach FETCH_HEAD
          test "$(git -C "$idf" rev-parse HEAD)" = "$commit"
          git -C "$idf" submodule update --init --recursive --depth=1
          "$idf/install.sh" esp32
          echo "IDF_PATH=$idf" >> "$GITHUB_ENV"

      - name: Build authoritative Battery Monitor firmware
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          bash battery-monitor/firmware/idf/build.sh /tmp/battery-monitor-firmware
          test -f /tmp/battery-monitor-firmware/BatteryMonitor.ino.bin
          test -f /tmp/battery-monitor-firmware/BatteryMonitor.ino.merged.bin
          test "$(stat -c %s /tmp/battery-monitor-firmware/BatteryMonitor.ino.merged.bin)" -eq 4194304

      - name: Upload unsigned CI firmware binaries
        uses: actions/upload-artifact@v7
        with:
          name: battery-monitor-esp32-CI-UNSIGNED-v0.1.0
          path: /tmp/battery-monitor-firmware

  windows:
    name: Windows .NET 8 client
    runs-on: windows-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download exact unsigned CI firmware built by firmware job
        uses: actions/download-artifact@v8
        with:
          name: battery-monitor-esp32-CI-UNSIGNED-v0.1.0
          path: battery-monitor/windows/staging/firmware

      - name: Download and verify Espressif esptool 5.3.1
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'esptool-v5.3.1-windows-amd64.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/espressif/esptool/releases/download/v5.3.1/esptool-v5.3.1-windows-amd64.zip' `
            -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '2b4a73c45db27426685896f64ce3e557f63a64f43cc100cb65c0cc3486af96d3'
          if ($actual -ne $expected) { throw "esptool SHA256 mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path battery-monitor/windows/staging/esptool | Out-Null
          Expand-Archive -Path $zip -DestinationPath battery-monitor/windows/staging/esptool -Force
          $exe = Get-ChildItem battery-monitor/windows/staging/esptool -Filter esptool.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'esptool.exe not found after extraction' }
          & $exe.FullName version

      - name: Build pinned Espressif Security 2 provisioner helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vendorCommit = '3ba4a43776a737054b43ead300ea0377787cad4a'
          $idfCommit = 'fcae32885b0296b32044cb99ecbdc50d98dddb83'

          $vendor = Join-Path $env:RUNNER_TEMP 'idf-extra-components'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          git -C $vendor init
          git -C $vendor remote add origin https://github.com/espressif/idf-extra-components.git
          git -C $vendor fetch --depth=1 origin $vendorCommit
          git -C $vendor checkout --detach FETCH_HEAD
          $actualCommit = (git -C $vendor rev-parse HEAD).Trim()
          if ($actualCommit -ne $vendorCommit) { throw "Espressif provisioner source commit mismatch: $actualCommit" }

          $idf = Join-Path $env:RUNNER_TEMP 'esp-idf'
          New-Item -ItemType Directory -Force -Path $idf | Out-Null
          git -C $idf init
          git -C $idf remote add origin https://github.com/espressif/esp-idf.git
          git -C $idf fetch --depth=1 origin $idfCommit
          git -C $idf checkout --detach FETCH_HEAD
          $actualIdfCommit = (git -C $idf rev-parse HEAD).Trim()
          if ($actualIdfCommit -ne $idfCommit) { throw "ESP-IDF source commit mismatch: $actualIdfCommit" }

          python -m pip install --disable-pip-version-check `
            pyinstaller==6.16.0 `
            cryptography==46.0.3 `
            protobuf==5.29.5 `
            bleak==1.1.1

          $provDir = Join-Path $vendor 'network_provisioning/tool/esp_prov'
          $networkProto = Join-Path $vendor 'network_provisioning/python'
          $idfProto = Join-Path $idf 'components/protocomm/python'
          if (-not (Test-Path "$idfProto/sec2_pb2.py")) { throw 'Pinned ESP-IDF protocomm Python modules are missing' }
          if (-not (Test-Path "$networkProto/network_config_pb2.py")) { throw 'Pinned network provisioning Python modules are missing' }

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name BatteryMonitorEspProv `
            --paths $provDir `
            --add-data "$idfProto;idf/components/protocomm/python" `
            --add-data "$networkProto;python" `
            battery-monitor/windows/esp_provision_helper.py

          $helperDir = 'battery-monitor/windows/staging/esp-provisioner'
          New-Item -ItemType Directory -Force -Path $helperDir | Out-Null
          Copy-Item dist/BatteryMonitorEspProv.exe "$helperDir/BatteryMonitorEspProv.exe"
          Copy-Item "$vendor/json_parser/LICENSE" "$helperDir/APACHE-2.0.txt"
          @"
          Espressif Security-2 provisioning helper sources
          idf-extra-components repository: https://github.com/espressif/idf-extra-components
          idf-extra-components commit: $vendorCommit
          component: network_provisioning/tool/esp_prov
          ESP-IDF repository: https://github.com/espressif/esp-idf
          ESP-IDF commit: $idfCommit (v5.5.1)
          protocomm support: components/protocomm/python
          source license: Apache-2.0
          "@ | Set-Content "$helperDir/PINNED-SOURCE.txt"

          $helperOutput = '{"protocol":"INVALID"}' | & "$helperDir/BatteryMonitorEspProv.exe"
          $helperExit = $LASTEXITCODE
          if ($helperExit -ne 1) { throw "Provisioning helper smoke test returned unexpected exit code $helperExit" }
          if ($helperOutput -notmatch 'BATMONPROV1') { throw 'Standalone provisioning helper did not start correctly' }
          $global:LASTEXITCODE = 0

      - name: Build
        shell: pwsh
        run: |
          dotnet restore battery-monitor/windows/BatteryMonitor.Client/BatteryMonitor.Client.csproj
          dotnet build battery-monitor/windows/BatteryMonitor.Client/BatteryMonitor.Client.csproj -c Release --no-restore

      - name: Run P0-3 protocol self-test
        shell: pwsh
        run: |
          dotnet run --project battery-monitor/windows/BatteryMonitor.Client/BatteryMonitor.Client.csproj -c Release --no-build -- --protocol-self-test

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish battery-monitor/windows/BatteryMonitor.Client/BatteryMonitor.Client.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o battery-monitor/windows/publish

      - name: Bundle unsigned CI firmware and tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path battery-monitor/windows/publish/firmware | Out-Null
          New-Item -ItemType Directory -Force -Path battery-monitor/windows/publish/tools/esptool | Out-Null
          New-Item -ItemType Directory -Force -Path battery-monitor/windows/publish/tools/esp-provisioner | Out-Null
          $merged = Get-ChildItem battery-monitor/windows/staging/firmware -Filter 'BatteryMonitor.ino.merged.bin' -Recurse | Select-Object -First 1
          $app = Get-ChildItem battery-monitor/windows/staging/firmware -Filter 'BatteryMonitor.ino.bin' -Recurse | Select-Object -First 1
          if (-not $merged) { throw 'Merged Battery Monitor factory firmware was not downloaded from firmware job' }
          if (-not $app) { throw 'Battery Monitor application update image was not downloaded from firmware job' }
          Copy-Item $merged.FullName battery-monitor/windows/publish/firmware/BatteryMonitor.ino.merged.bin
          Copy-Item $app.FullName battery-monitor/windows/publish/firmware/BatteryMonitor.ino.bin
          @"
          BATTERY MONITOR CI BUILD - UNSIGNED FIRMWARE

          This is the same authoritative ESP-IDF + Arduino-component firmware
          architecture used by signed releases. These particular CI images are
          intentionally unsigned, so the Windows client's firmware update and
          factory/recovery functions reject them. The gated signed-release
          workflow signs the same build outputs for flash-capable packages.
          "@ | Set-Content battery-monitor/windows/publish/firmware/UNSIGNED_CI_BUILD.txt
          Copy-Item battery-monitor/windows/staging/esptool/* battery-monitor/windows/publish/tools/esptool -Recurse -Force
          Copy-Item battery-monitor/windows/staging/esp-provisioner/* battery-monitor/windows/publish/tools/esp-provisioner -Recurse -Force
          $tool = Get-ChildItem battery-monitor/windows/publish/tools/esptool -Filter esptool.exe -Recurse | Select-Object -First 1
          $provisioner = Get-ChildItem battery-monitor/windows/publish/tools/esp-provisioner -Filter BatteryMonitorEspProv.exe -Recurse | Select-Object -First 1
          if (-not $tool) { throw 'Bundled esptool.exe missing' }
          if (-not $provisioner) { throw 'Bundled Security-2 provisioning helper missing' }
          Get-FileHash battery-monitor/windows/publish/firmware/BatteryMonitor.ino.bin -Algorithm SHA256
          Get-FileHash battery-monitor/windows/publish/firmware/BatteryMonitor.ino.merged.bin -Algorithm SHA256
          Get-FileHash $provisioner.FullName -Algorithm SHA256

      - name: Upload unsigned CI Windows client
        uses: actions/upload-artifact@v7
        with:
          name: Battery-Monitor-Windows-CI-UNSIGNED-v0.1.0
          path: battery-monitor/windows/publish

  android:
    name: Android provisioning APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p battery-monitor/android :app:assembleDebug --stacktrace

      - name: Stage APK
        run: cp battery-monitor/android/app/build/outputs/apk/debug/app-debug.apk /tmp/Battery-Monitor-Setup-v0.1.0.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: Battery-Monitor-Setup-Android-v0.1.0
          path: /tmp/Battery-Monitor-Setup-v0.1.0.apk
