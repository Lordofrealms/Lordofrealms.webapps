name: Pad Grade v1.0.8 Recovery + Heat Diagnostics

on:
  pull_request:
    branches: [pad-grade-dev, main]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-v108-recovery-heat-diag.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and schema rollback checks
        run: |
          for f in v108-recovery-save-guard.js v108-index-fastpath.js v096-native-async.js v107-index-reconcile.js v107-compare-fast.js v063-dev.js heatmap-raster-worker-v078.js v090-first-run-guard.js v071-dev.js v070-dev.js; do node --check "pad-grade/$f"; done
          node pad-grade/project-format-v107-selftest.js
          node pad-grade/v107-index-reconcile-selftest.js
          grep -F 'CURRENT_SCHEMA=6,ROLLBACK_SCHEMA=5' pad-grade/project-format-v107.js
          grep -F 'downgradeFolderToV5' pad-grade/v107-index-reconcile.js
          grep -E 'versionCode = (8[0-9]|[9][0-9]|[1-9][0-9]{2,})' pad-grade-android/app/build.gradle.kts
          grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' pad-grade-android/app/build.gradle.kts
          grep -E '<title>Pad Grade Mapper v[0-9]+\.[0-9]+\.[0-9]+ DEV</title>' pad-grade/index.html

      - name: Verify recovery race defenses
        run: |
          grep -F 'v108-recovery-save-guard.js?v=20260830-1' pad-grade/index.html
          grep -F '__padGradeRecoveryReloadPlannedV108=true' pad-grade/v090-first-run-guard.js
          grep -F '__padGradeRecoveryReloadPlannedV108=true' pad-grade/v071-dev.js
          grep -F '__padGradeRecoveryReloadPlannedV108=true' pad-grade/v070-dev.js
          grep -F 'loadProject(id,forceDurable=false)' pad-grade/v107-index-reconcile.js
          grep -F '!forceDurable&&!e?.localBodyStale' pad-grade/v107-index-reconcile.js
          grep -F 'loadProject(desired,forceDurableActive)' pad-grade/v107-index-reconcile.js
          grep -F 'recovery.active-durable-force-load' pad-grade/v107-index-reconcile.js
          grep -F 'recovery.autosave-local-write-blocked' pad-grade/v108-recovery-save-guard.js
          grep -F 'recovery.autosave-durable-write-blocked' pad-grade/v108-recovery-save-guard.js

      - name: Exercise recovery save guard behavior
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          class Storage{constructor(){this.m=new Map()}setItem(k,v){this.m.set(String(k),String(v))}getItem(k){return this.m.has(String(k))?this.m.get(String(k)):null}removeItem(k){this.m.delete(String(k))}}
          const localStorage=new Storage(),listeners={},calls={writes:0},events=[];
          const indexA=JSON.stringify({format:'PadGradeProjectIndex',indexVersion:1,updatedAt:'a',projects:[{filename:'ABC.padgrade',projectId:'p1',size:10,lastModified:1}]});
          const indexB=JSON.stringify({format:'PadGradeProjectIndex',indexVersion:1,updatedAt:'b',projects:[{filename:'ABC.padgrade',projectId:'p1',size:10,lastModified:1}]});
          const files={read:async n=>n==='Pad-Grade-Project-Index.pgindex'?indexA:'x',write:async()=>{calls.writes++;return true},writeResult:async()=>{calls.writes++;return{ok:true}}};
          const window={PadGradeFiles:files,PadGradeDiag:{mark:(n,d)=>events.push([n,d])},addEventListener:(n,f)=>(listeners[n]??=[]).push(f)};
          vm.runInNewContext(fs.readFileSync('pad-grade/v108-recovery-save-guard.js','utf8'),{window,Storage,localStorage,Promise,JSON,String,Map,console});
          localStorage.setItem('padGradeProjectV5:p1','full');
          (async()=>{
            await window.PadGradeFiles.read('Pad-Grade-Project-Index.pgindex');const before=calls.writes;
            assert.equal(await window.PadGradeFiles.write('Pad-Grade-Project-Index.pgindex',indexB),true);assert.equal(calls.writes,before);assert(events.some(x=>x[0]==='index.write-skipped-unchanged'));
            window.__padGradeRecoveryReloadPlannedV108=true;for(const f of listeners.beforeunload||[])f({});
            localStorage.setItem('padGradeProjectV5:p1','tiny');localStorage.setItem('padGradeProjectsV5','bad');localStorage.setItem('other','ok');
            assert.equal(localStorage.getItem('padGradeProjectV5:p1'),'full');assert.equal(localStorage.getItem('padGradeProjectsV5'),null);assert.equal(localStorage.getItem('other'),'ok');
            const b=calls.writes;assert.equal(await window.PadGradeFiles.write('ABC-p1.padgrade','tiny'),false);assert.equal(calls.writes,b);assert.equal(await window.PadGradeFiles.write('Pad-Grade-Settings.pgsettings','{}'),true);assert.equal(calls.writes,b+1);
            for(const n of ['recovery.autosave-block-engaged','recovery.autosave-local-write-blocked','recovery.autosave-durable-write-blocked'])assert(events.some(x=>x[0]===n),n);
            console.log('v1.0.8 recovery save guard behavioral test passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify index and comparison fast paths
        run: |
          grep -F 'index.catalog-memory-hit' pad-grade/v108-index-fastpath.js
          grep -F 'padgrade-project-folder-refreshed' pad-grade/v108-index-fastpath.js
          grep -F 'index.write-skipped-unchanged' pad-grade/v108-recovery-save-guard.js
          grep -F 'v108-index-fastpath.js?v=20260830-1' pad-grade/v096-native-async.js
          node pad-grade/project-compare-selftest.js
          grep -F 'pgCompareLegendBar .cut{background:linear-gradient' pad-grade/v107-compare-fast.js
          grep -F 'pgCompareLegendBar .grade{background:#4f8f3a}' pad-grade/v107-compare-fast.js
          grep -F 'pgCompareLegendBar .fill{background:linear-gradient' pad-grade/v107-compare-fast.js
          grep -F 'startHeat(serial);makeMap(g,serial);' pad-grade/v107-compare-fast.js
          ! grep -F "geometry();M.on('click',probe);startHeat" pad-grade/v107-compare-fast.js
          grep -F 'compare.heat-buffered-until-map' pad-grade/v107-compare-fast.js
          grep -F 'mapReady=true;flushPendingHeat();' pad-grade/v107-compare-fast.js

      - name: Verify apples-to-apples heat diagnostics
        run: |
          for s in workerElapsedMs rasterizeElapsedMs colorElapsedMs; do grep -F "$s" pad-grade/heatmap-raster-worker-v078.js; done
          grep -F "context:'regular'" pad-grade/v063-dev.js
          grep -F 'heatmap.regular-worker-posted' pad-grade/v063-dev.js
          grep -F 'heatmap.regular-worker-complete' pad-grade/v063-dev.js
          grep -F 'heatmap.regular-visible' pad-grade/v063-dev.js
          grep -F "context:'comparison'" pad-grade/v107-compare-fast.js
          grep -F 'compare.heat-worker-posted' pad-grade/v107-compare-fast.js
          grep -F 'compare.heat-worker-complete' pad-grade/v107-compare-fast.js
          grep -F 'compare.heat-visible' pad-grade/v107-compare-fast.js
          grep -F 'totalPostToVisibleMs' pad-grade/v063-dev.js
          grep -F 'totalPostToVisibleMs' pad-grade/v107-compare-fast.js
          grep -F 'heatmap-raster-worker-v078.js?v=20260830-4' pad-grade/v078-dev.js
          grep -F 'heatmap-raster-worker-v078.js?v=20260830-4' pad-grade/v107-compare-fast.js

      - name: Preserve fixed 15 percent map hitbox behavior
        run: |
          grep -F 'const HITBOX_PADDING_PCT=15;' pad-grade/v106-map-hitbox.js
          grep -F 'const TOTAL_RADIUS_CAP=0.45;' pad-grade/v106-map-hitbox.js
