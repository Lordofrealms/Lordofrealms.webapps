name: Precision Location Release

on:
  push:
    branches:
      - precision-location-v0.4.0
    paths:
      - '.github/workflows/precision-location-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build v0.4.0 APK
        run: |
          gradle -p precision-location-android :app:assembleDebug --stacktrace
          cp precision-location-android/app/build/outputs/apk/debug/app-debug.apk precision-location-v0.4.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: precision-location-v0.4.0
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Precision Location v0.4.0

          - Adds carrier-phase-smoothed pseudorange processing.
          - Adds TDCP-aided range-rate estimation.
          - Adds smartphone uncertainty/CN0 weighting for broadcast SPP and HAS PPP.
          - Adds conservative cycle-slip, reset, half-cycle, clock-discontinuity and outlier handling.
          - Lowers the Enhanced GNSS reported minimum horizontal uncertainty floor to 0.5 m.
          - Keeps Galileo HAS as the only signup-based precision correction path.
          - Replay tooling remains intentionally deferred.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" precision-location-v0.4.0.apk --clobber
          else
            gh release create "$TAG" precision-location-v0.4.0.apk \
              --target "$GITHUB_SHA" \
              --title "Precision Location v0.4.0" \
              --notes-file /tmp/release-notes.md
          fi
