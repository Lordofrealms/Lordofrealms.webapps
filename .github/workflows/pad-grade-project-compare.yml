name: Pad Grade Project Compare Tests

on:
  push:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/project-compare-core.js'
      - 'pad-grade/project-compare-selftest.js'
      - 'pad-grade/v081-project-compare.js'
      - 'pad-grade/v082-project-compare-fix.js'
      - 'pad-grade/v083-project-compare-fix.js'
      - 'pad-grade/v085-map-render-order.js'
      - 'pad-grade/v086-compare-presentation.js'
      - 'pad-grade/v087-compare-back.js'
      - 'pad-grade/v072-project-restore.js'
      - 'pad-grade/map.js'
      - 'pad-grade/v078-dev.js'
      - 'pad-grade/map-instance-hook-v064.js'
      - 'pad-grade/index.html'
      - '.github/workflows/pad-grade-project-compare.yml'
  pull_request:
    branches: [main, pad-grade-dev]
    paths:
      - 'pad-grade/project-compare-core.js'
      - 'pad-grade/project-compare-selftest.js'
      - 'pad-grade/v081-project-compare.js'
      - 'pad-grade/v082-project-compare-fix.js'
      - 'pad-grade/v083-project-compare-fix.js'
      - 'pad-grade/v085-map-render-order.js'
      - 'pad-grade/v086-compare-presentation.js'
      - 'pad-grade/v087-compare-back.js'
      - 'pad-grade/v072-project-restore.js'
      - 'pad-grade/map.js'
      - 'pad-grade/v078-dev.js'
      - 'pad-grade/map-instance-hook-v064.js'
      - 'pad-grade/index.html'
      - '.github/workflows/pad-grade-project-compare.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate comparison and startup scripts
        run: |
          node --check pad-grade/project-compare-core.js
          node --check pad-grade/project-compare-selftest.js
          node --check pad-grade/v081-project-compare.js
          node --check pad-grade/v082-project-compare-fix.js
          node --check pad-grade/v083-project-compare-fix.js
          node --check pad-grade/v085-map-render-order.js
          node --check pad-grade/v086-compare-presentation.js
          node --check pad-grade/v087-compare-back.js
          node --check pad-grade/v072-project-restore.js
          node --check pad-grade/map.js
          node --check pad-grade/map-instance-hook-v064.js
          grep -F "project-compare-core.js?v=20260829-1" pad-grade/v078-dev.js
          grep -F "v081-project-compare.js?v=20260829-1" pad-grade/v078-dev.js
          grep -F "v083-project-compare-fix.js?v=20260829-1" pad-grade/v078-dev.js
          grep -F "v085-map-render-order.js?v=20260829-3" pad-grade/v078-dev.js
          grep -F "v086-compare-presentation.js?v=20260829-2" pad-grade/v085-map-render-order.js
          grep -F "padgrade-maplibre-ready" pad-grade/v085-map-render-order.js
          grep -F "padgrade-map-runtime-ready" pad-grade/v085-map-render-order.js
      - name: Verify startup isolation and non-blocking project reveal
        run: |
          grep -F "retired-startup-coupled-comparison-layer" pad-grade/v082-project-compare-fix.js
          ! grep -F "setInterval" pad-grade/v082-project-compare-fix.js
          ! grep -F "MutationObserver" pad-grade/v082-project-compare-fix.js
          ! grep -F "v083-project-compare-fix.js" pad-grade/index.html
          ! grep -F "v085-map-render-order.js" pad-grade/index.html
          grep -F "v082-project-compare-fix.js?v=20260829-1" pad-grade/index.html
          ! grep -F "Date.now()+60000" pad-grade/v072-project-restore.js
          grep -F "background-never-block-visible-grid" pad-grade/v072-project-restore.js
          grep -F "revealLocalImmediately" pad-grade/v072-project-restore.js
          grep -F "frameSavedPad" pad-grade/map.js
          grep -F "map.fitBounds" pad-grade/map.js
          grep -F "padgrade-active-project-applied" pad-grade/map.js
          grep -F "map.on('style.load',()=>frameSavedPad(false))" pad-grade/map.js
      - name: Verify legacy map hook cannot recapture comparison map
        run: |
          grep -F "window.__padGradeMapHookInstalled=true" pad-grade/map-instance-hook-v064.js
          node <<'NODE'
          global.window=global;
          class BaseMap { constructor(options){ this.options=options; } }
          window.maplibregl={Map:BaseMap};
          const events=[];
          window.CustomEvent=class CustomEvent {
            constructor(type,init){ this.type=type; this.detail=init&&init.detail; }
          };
          window.dispatchEvent=event=>{ events.push(event); return true; };
          require('./pad-grade/map-instance-hook-v064.js');
          if(window.__padGradeMapHookInstalled!==true) throw new Error('legacy fallback map hook was not marked satisfied');
          const primary=new window.maplibregl.Map({container:'gpsMap'});
          if(window.__padGradeMapInstance!==primary) throw new Error('gpsMap was not registered as the primary map');
          const comparison=new window.maplibregl.Map({container:'pgCompareMap'});
          if(window.__padGradeMapInstance!==primary) throw new Error('comparison map replaced the primary map');
          if(events.length!==1||events[0].detail.map!==primary) throw new Error('comparison map emitted a primary map-created event');
          if(comparison===primary) throw new Error('comparison unexpectedly reused the primary map object');
          NODE
      - name: Verify grid-first foreground render policy
        run: |
          grep -F "script.setAttribute('data-padgrade-v030','1')" pad-grade/v085-map-render-order.js
          grep -F "DOMContentLoaded" pad-grade/v085-map-render-order.js
          grep -F "PRIMARY_HEAT_PREFIX" pad-grade/v085-map-render-order.js
          grep -F "moveBeforeIfNeeded(map,id,PRIMARY_GRID)" pad-grade/v085-map-render-order.js
          grep -F "moveBeforeIfNeeded(map,id,COMPARE_GRID)" pad-grade/v085-map-render-order.js
          grep -F "COMPARE_LABELS" pad-grade/v085-map-render-order.js
          grep -F "for(const id of [COMPARE_GRID,COMPARE_OUTLINE,COMPARE_POINTS,COMPARE_LABELS])moveToTopIfNeeded" pad-grade/v085-map-render-order.js
          grep -F "compareMap.addLayer({id:GRID_LAYER" pad-grade/v081-project-compare.js
          grep -F "compareMap.addLayer({id:POINT_LAYER" pad-grade/v081-project-compare.js
          grep -F "}},GRID_LAYER);" pad-grade/v081-project-compare.js
      - name: Verify comparison point styling, color key, and Back behavior
        run: |
          grep -F "const CUT='#a83a2b',GRADE='#4f8f3a',FILL='#315fa8'" pad-grade/v086-compare-presentation.js
          grep -F "'circle-radius',6" pad-grade/v086-compare-presentation.js
          grep -F "id:LABEL_LAYER,type:'symbol'" pad-grade/v086-compare-presentation.js
          grep -F "'text-field':['get','label']" pad-grade/v086-compare-presentation.js
          grep -F ".pgCompareLegend{display:none!important}" pad-grade/v086-compare-presentation.js
          grep -F "pgCompareLegendBar" pad-grade/v086-compare-presentation.js
          grep -F "GRADE ±" pad-grade/v086-compare-presentation.js
          grep -F "system-back-exits-compare-before-app" pad-grade/v087-compare-back.js
      - name: Run comparison self-tests
        run: node pad-grade/project-compare-selftest.js
