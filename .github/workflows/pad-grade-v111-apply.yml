name: Pad Grade v1.1.1 One-Shot Apply

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - '.github/workflows/pad-grade-v111-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage Pad Grade v1.1.1 apply workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev
          fetch-depth: 0

      - name: Apply v1.1.1 DEV changes atomically
        shell: bash
        run: |
          printf '%s' '[TRUNCATED_FOR_BREVITY_IN_TOOL_PAYLOAD]' | base64 -d | gzip -d > pad-grade/v063-dev.js
          printf '%s' '' | base64 -d | gzip -d > pad-grade/v111-resilience.js
          printf '%s' '' | base64 -d | gzip -d > pad-grade/v111-resilience-selftest.js
          printf '%s' '' | base64 -d | gzip -d > /tmp/pg-web-section.md
          printf '%s' '' | base64 -d | gzip -d > /tmp/pg-android-section.md
          printf '%s' '' | base64 -d | gzip -d > .github/workflows/pad-grade-v111-resilience.yml

          python3 - <<'PYCODE'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: missing patch anchor: {label}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_one('pad-grade/index.html','<title>Pad Grade Mapper v1.1.0 DEV</title>','<title>Pad Grade Mapper v1.1.1 DEV</title>','html title')
          replace_one('pad-grade/index.html','<script src="v075-startup.js?v=20260829-5"></script>\n<script src="init.js?v=20260819-1"></script>','<script src="v075-startup.js?v=20260829-5"></script>\n<script src="v111-resilience.js?v=20260830-1"></script>\n<script src="init.js?v=20260819-1"></script>','v111 loader')
          replace_one('pad-grade-android/app/build.gradle.kts','versionCode = 82','versionCode = 83','versionCode')
          replace_one('pad-grade-android/app/build.gradle.kts','versionName = "1.1.0"','versionName = "1.1.1"','versionName')

          for path,section_path in [('pad-grade/CHANGELOG.md','/tmp/pg-web-section.md'),('pad-grade-android/CHANGELOG.md','/tmp/pg-android-section.md')]:
              p=Path(path); text=p.read_text(encoding='utf-8'); section=Path(section_path).read_text(encoding='utf-8')
              if '## v1.1.1 — development build' not in text:
                  marker='## v1.1.0 — development build'
                  if marker not in text: raise SystemExit(f'{path}: v1.1.0 marker missing')
                  p.write_text(text.replace(marker,section+marker,1),encoding='utf-8')

          Path('.github/workflows/pad-grade-v111-apply.yml').unlink()
          PYCODE

          node --check pad-grade/v063-dev.js
          node --check pad-grade/v111-resilience.js
          node --check pad-grade/v111-resilience-selftest.js
          node pad-grade/v110-staged-heat-selftest.js
          node pad-grade/v111-resilience-selftest.js

      - name: Commit v1.1.1 DEV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Pad Grade v1.1.1 DEV — resilient project overlays and faster startup'
          git push origin HEAD:pad-grade-dev
