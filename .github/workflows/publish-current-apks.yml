name: Publish Current Android APKs

on:
  push:
    branches: [main]
    paths:
      - '.github/release-trigger.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/release-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release targets
        run: |
          git fetch origin main precision-location-android
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "PRECISION_SHA=$(git rev-parse origin/precision-location-android)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Pad Grade v0.4.1
        run: |
          git worktree add /tmp/pad-grade "$MAIN_SHA"
          node --check /tmp/pad-grade/pad-grade/capture-fix.js
          node --check /tmp/pad-grade/pad-grade/v040.js
          node --check /tmp/pad-grade/pad-grade/v040-sync.js
          node --check /tmp/pad-grade/pad-grade/v041.js
          node --check /tmp/pad-grade/pad-grade/v041-persist.js
          gradle -p /tmp/pad-grade/pad-grade-android :app:assembleDebug --stacktrace
          cp /tmp/pad-grade/pad-grade-android/app/build/outputs/apk/debug/app-debug.apk Pad-Grade-v0.4.1.apk

      - name: Checkout Precision Location branch
        run: git worktree add /tmp/precision-location "$PRECISION_SHA"

      - name: Validate Galileo HAS fixture
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/hirokawa/cssrlib-data/main/data/doy2023-229/idd2023229c.rtc \
            --output /tmp/galileo-has-idd.rtc
          python3 /tmp/precision-location/precision-location-android/tools/rtcm_inventory.py \
            /tmp/galileo-has-idd.rtc --require-ssr

      - name: Build Precision Location v0.3.2
        run: |
          gradle -p /tmp/precision-location/precision-location-android :app:assembleDebug --stacktrace
          cp /tmp/precision-location/precision-location-android/app/build/outputs/apk/debug/app-debug.apk Precision-Location-v0.3.2.apk

      - name: Publish Pad Grade v0.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view pad-grade-v0.4.1 >/dev/null 2>&1; then
            gh release upload pad-grade-v0.4.1 Pad-Grade-v0.4.1.apk --clobber
          else
            gh release create pad-grade-v0.4.1 Pad-Grade-v0.4.1.apk \
              --target "$MAIN_SHA" \
              --title "Pad Grade v0.4.1" \
              --notes "Pad Grade v0.4.1 adds project archive/restore with a separate archived-project view, preserves open/archived lifecycle status in project exports and backups, adds Export Current and Backup All/restore support for the web app, and makes grade-grid cell sizing uniform by reserving the same five populated information lines in every cell before deciding whether to fit or scroll."
          fi

      - name: Publish Precision Location v0.3.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view precision-location-v0.3.2 >/dev/null 2>&1; then
            gh release upload precision-location-v0.3.2 Precision-Location-v0.3.2.apk --clobber
          else
            gh release create precision-location-v0.3.2 Precision-Location-v0.3.2.apk \
              --target "$PRECISION_SHA" \
              --title "Precision Location v0.3.2" \
              --notes "Precision Location v0.3.2. Enhanced GNSS/non-HAS reported horizontal accuracy floor is 1.0 m while existing uncertainty-widening logic remains active; Galileo HAS PPP behavior is unchanged."
          fi

      - name: Verify Pad Grade release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pad-grade-v0.4.1 --json assets --jq '.assets[].name' | grep -Fx 'Pad-Grade-v0.4.1.apk'

      - name: Report Precision Location release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Precision Location release assets:'
          gh release view precision-location-v0.3.2 --json assets --jq '.assets[].name' || true

      - name: Confirm publishing on validation PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "✅ Verified GitHub Release published successfully with direct Pad Grade APK asset: Pad-Grade-v0.4.1.apk."
