name: Pad Grade v1.1.7 Image Heat + Background Idle

on:
  push:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v117-dev.js'
      - 'pad-grade/v117-image-idle-selftest.js'
      - 'pad-grade/index.html'
      - 'pad-grade-android/app/build.gradle.kts'
      - 'pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java'
      - 'pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeLifecycleBridge.java'
      - '.github/workflows/pad-grade-v117-image-idle.yml'
  pull_request:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v117-dev.js'
      - 'pad-grade/v117-image-idle-selftest.js'
      - 'pad-grade/index.html'
      - 'pad-grade-android/app/build.gradle.kts'
      - 'pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/MainActivity.java'
      - 'pad-grade-android/app/src/main/java/com/lordofrealms/padgrade/PadGradeLifecycleBridge.java'
      - '.github/workflows/pad-grade-v117-image-idle.yml'
  workflow_dispatch:

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check v1.1.7 presentation runtime
        run: node --check pad-grade/v117-dev.js
      - name: Verify ImageSource, background idle, exit diagnostics, and version wiring
        run: node pad-grade/v117-image-idle-selftest.js
