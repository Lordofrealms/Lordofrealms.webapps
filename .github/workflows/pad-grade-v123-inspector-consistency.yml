name: Pad Grade v1.2.3 Inspector Consistency

on:
  pull_request:
    branches: [pad-grade-dev, main]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-v123-inspector-consistency.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check v1.2.3 runtime and test
        run: |
          node --check pad-grade/v123-dev.js
          node --check pad-grade/v123-inspector-consistency-selftest.js
      - name: Verify exact Auto/manual tier binding
        run: node pad-grade/v123-inspector-consistency-selftest.js
      - name: Carry forward v1.2.2 no-flicker regression
        run: node pad-grade/v122-canvas-handoff-selftest.js
      - name: Verify v1.2.3 release wiring
        run: |
          grep -F '<title>Pad Grade Mapper v1.2.3 DEV</title>' pad-grade/index.html
          grep -F 'src="v122-dev.js?v=20260831-1' pad-grade/index.html
          grep -F 'src="v123-dev.js?v=20260831-1' pad-grade/index.html
          grep -F "canonicalSourceRecreate:false" pad-grade/v123-dev.js
          grep -F "canonicalLayerRecreate:false" pad-grade/v123-dev.js
          grep -F 'versionCode = 95' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.2.3"' pad-grade-android/app/build.gradle.kts
          grep -F '# Pad Grade Mapper v1.2.3 — DEV BUILD' pad-grade/RELEASE_NOTES.md
