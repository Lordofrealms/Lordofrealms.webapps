name: Pad Grade v1.1.9 Finalize Temp

on:
  push:
    branches:
      - pad-grade-dev-v119-heat-cutover

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v119-heat-cutover
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply finalization
        run: python v119_finalize.py
      - name: Validate runtime and cutover
        run: |
          node --check pad-grade/v119-dev.js
          node pad-grade/v119-heat-cutover-selftest.js
          git diff --check
      - name: Commit finalized files
        run: |
          rm v119_finalize.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] [v119-finalize] Finalize Pad Grade v1.1.9 DEV heat cutover'
          git push origin HEAD:pad-grade-dev-v119-heat-cutover
