name: Pad Grade v1.0.9 changelog structure fix
on:
  push:
    branches: [pad-grade-dev-v109-progressive-heat]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v109-changelog-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v109-progressive-heat
      - name: Place v1.0.9 entry beneath canonical changelog header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('pad-grade/CHANGELOG.md','pad-grade-android/CHANGELOG.md'):
              p=Path(name);t=p.read_text()
              if not t.startswith('## v1.0.9 — development build\n'):
                  raise SystemExit(f'unexpected changelog prefix: {name}')
              marker='\n# Changelog\n'
              i=t.index(marker)
              entry=t[:i].rstrip()+"\n\n"
              rest=t[i+1:]
              # Insert after the introductory paragraph block and before v1.0.8.
              j=rest.index('\n## v1.0.8 — development build')
              head=rest[:j].rstrip()+"\n\n"
              tail=rest[j+1:]
              p.write_text(head+entry+tail)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pad-grade/CHANGELOG.md pad-grade-android/CHANGELOG.md
          git commit -m "Fix v1.0.9 changelog placement [v109-changelog-fix]"
          git push origin HEAD:pad-grade-dev-v109-progressive-heat
