name: Temporary Pad Grade Android notes publisher correction

on:
  push:
    branches: [dev/pad-grade-android-current-version-notes]
    paths:
      - '.github/workflows/pad-grade-android-notes-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/pad-grade-android-current-version-notes
      - name: Make Android publisher current-version-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pad-grade-android.yml')
          text=p.read_text()
          anchor='''      - name: Verify release notes match app version
        run: |
          test -s pad-grade/RELEASE_NOTES.md
          grep -F "## v$APP_VERSION —" pad-grade/RELEASE_NOTES.md

'''
          addition='''      - name: Build current-version release notes only
        run: |
          python3 - "$APP_VERSION" /tmp/pad-grade-release-notes.md <<'PYNOTES'
          import re, sys
          from pathlib import Path
          version,out=sys.argv[1:]
          text=Path('pad-grade/RELEASE_NOTES.md').read_text(encoding='utf-8')
          title=re.search(rf'^# Pad Grade Mapper v{re.escape(version)}(?:\\s+—.*)?$', text, re.M)
          section=re.search(rf'^## v{re.escape(version)}(?:\\s+—.*)?$', text, re.M)
          if not title or not section or section.start() < title.start():
              raise SystemExit(f'Could not locate current v{version} release notes')
          end=len(text)
          separator=re.search(r'^---\\s*$', text[section.end():], re.M)
          next_title=re.search(r'^# Pad Grade Mapper v[0-9]+\\.[0-9]+\\.[0-9]+(?:\\s+—.*)?$', text[section.end():], re.M)
          candidates=[]
          if separator: candidates.append(section.end()+separator.start())
          if next_title: candidates.append(section.end()+next_title.start())
          if candidates: end=min(candidates)
          current=text[title.start():end].rstrip()+'\\n'
          version_heads=re.findall(r'^## v([0-9]+\\.[0-9]+\\.[0-9]+)(?:\\s+—.*)?$', current, re.M)
          if version_heads != [version]:
              raise SystemExit(f'Expected only v{version} section, found {version_heads}')
          Path(out).write_text(current,encoding='utf-8')
          PYNOTES

'''
          if '      - name: Build current-version release notes only\n' not in text:
              if anchor not in text: raise SystemExit('release-note verification anchor missing')
              text=text.replace(anchor,anchor+addition,1)
          count=text.count('--notes-file pad-grade/RELEASE_NOTES.md')
          if count!=4: raise SystemExit(f'expected 4 cumulative notes-file uses, found {count}')
          text=text.replace('--notes-file pad-grade/RELEASE_NOTES.md','--notes-file /tmp/pad-grade-release-notes.md')
          stable='''          gh release view "$RELEASE_TAG" --json body --jq '.body' | grep -F "## v$APP_VERSION —"

      - name: Verify dev GitHub Pre-release APK
'''
          stable_new='''          gh release view "$RELEASE_TAG" --json body --jq '.body' > /tmp/published-pad-grade-release-notes.md
          grep -F "## v$APP_VERSION —" /tmp/published-pad-grade-release-notes.md
          test "$(grep -Ec '^## v[0-9]+\\.[0-9]+\\.[0-9]+' /tmp/published-pad-grade-release-notes.md)" -eq 1
          test "$(grep -Ec '^# Pad Grade Mapper v[0-9]+\\.[0-9]+\\.[0-9]+' /tmp/published-pad-grade-release-notes.md)" -eq 1

      - name: Verify dev GitHub Pre-release APK
'''
          if stable not in text: raise SystemExit('stable verification anchor missing')
          text=text.replace(stable,stable_new,1)
          dev='''          gh release view "$RELEASE_TAG" --json body --jq '.body' | grep -F "## v$APP_VERSION —"
'''
          dev_new='''          gh release view "$RELEASE_TAG" --json body --jq '.body' > /tmp/published-pad-grade-release-notes.md
          grep -F "## v$APP_VERSION —" /tmp/published-pad-grade-release-notes.md
          test "$(grep -Ec '^## v[0-9]+\\.[0-9]+\\.[0-9]+' /tmp/published-pad-grade-release-notes.md)" -eq 1
          test "$(grep -Ec '^# Pad Grade Mapper v[0-9]+\\.[0-9]+\\.[0-9]+' /tmp/published-pad-grade-release-notes.md)" -eq 1
'''
          if text.count(dev)!=1: raise SystemExit(f'expected one remaining dev verification anchor, found {text.count(dev)}')
          text=text.replace(dev,dev_new,1)
          p.write_text(text)
          PY
      - name: Commit publisher correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pad-grade-android.yml
          git diff --cached --check
          git commit -m 'Make Pad Grade Android release notes current-version-only'
          git push origin HEAD:dev/pad-grade-android-current-version-notes
