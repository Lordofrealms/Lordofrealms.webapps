name: Precision Location Android

# Deliberately quiet CI: ordinary code commits do not build automatically.
# Validation can be triggered either by bumping the trigger file on the feature
# branch, or by a tiny validation PR targeting the feature branch. The latter
# makes Actions logs available to the connected GitHub tooling without touching main.
on:
  push:
    branches: [precision-location-android]
    paths:
      - 'precision-location-android/ci-build-trigger.txt'
  pull_request:
    branches: [precision-location-android]
    paths:
      - 'precision-location-android/ci-build-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p precision-location-android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: precision-location-debug
          path: precision-location-android/app/build/outputs/apk/debug/app-debug.apk
