name: Pad Grade v1.1.1 Bundle Inspect

on:
  push:
    branches: [pad-grade-dev-v111-resilience]
    paths:
      - '.github/workflows/pad-grade-v111-bundle-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and list staged bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pad-grade-v111.bundle.part{01..08} > /tmp/pg-v111.b64
          echo "base64 bytes: $(wc -c < /tmp/pg-v111.b64)"
          base64 -d /tmp/pg-v111.b64 > /tmp/pg-v111.tar.gz
          gzip -t /tmp/pg-v111.tar.gz
          echo '--- archive members ---'
          tar -tzvf /tmp/pg-v111.tar.gz
          mkdir -p /tmp/pg-v111-out
          tar -xzf /tmp/pg-v111.tar.gz -C /tmp/pg-v111-out
          echo '--- file hashes ---'
          find /tmp/pg-v111-out -type f -print0 | sort -z | xargs -0 sha256sum
