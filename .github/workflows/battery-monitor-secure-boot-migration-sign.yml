name: Battery Monitor Secure Boot Migration Signing

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA whose migration candidate was tested by CI'
        required: true
        type: string
      ci_run_id:
        description: 'Successful Secure Boot Migration Candidate CI run ID containing exact unsigned bytes'
        required: true
        type: string
      version:
        description: 'Exact migration firmware version'
        required: true
        default: '0.1.2'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sign_migration:
    name: Sign exact CI Secure Boot migration app + bootloader
    runs-on: ubuntu-latest
    environment: battery-monitor-production-signing
    env:
      BATMON_SECURE_BOOT_V2_SIGNING_KEY_B64: ${{ secrets.BATMON_SECURE_BOOT_V2_SIGNING_KEY_B64 }}
      BATMON_SECURE_BOOT_V2_SIGNING_KEY_PASSWORD: ${{ secrets.BATMON_SECURE_BOOT_V2_SIGNING_KEY_PASSWORD }}
      BATMON_FIRMWARE_SIGNING_KEY_B64: ${{ secrets.BATMON_FIRMWARE_SIGNING_KEY_B64 }}
      BATMON_FIRMWARE_SIGNING_KEY_PASSWORD: ${{ secrets.BATMON_FIRMWARE_SIGNING_KEY_PASSWORD }}
      EXPECTED_DETACHED_KEY_FINGERPRINT: 69d6d94b706c57e783c6e2e4ad17e781e84d1e4e32addbcfca68976483be5e6e
    steps:
      - name: Validate requested source/run
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.source_sha }}' =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha must be an exact commit SHA.' >&2; exit 1; }
          [[ '${{ inputs.ci_run_id }}' =~ ^[0-9]+$ ]] || { echo 'ci_run_id must be numeric.' >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate migration version authority
        shell: bash
        run: |
          set -euo pipefail
          version_file='battery-monitor/firmware/idf/version-secure-boot-migration.txt'
          test -f "$version_file"
          source_version="$(tr -d '\r\n' < "$version_file")"
          test "$source_version" = '${{ inputs.version }}' || { echo "Requested version does not match migration authority: $source_version" >&2; exit 1; }
          [[ "$source_version" =~ ^([0-9])\.([0-9])\.([0-9])$ ]] || { echo "Migration version must use exactly three single-digit numeric components: $source_version" >&2; exit 1; }
          migration_sequence="$(( ${BASH_REMATCH[1]} * 100 + ${BASH_REMATCH[2]} * 10 + ${BASH_REMATCH[3]} ))"
          (( migration_sequence > 0 )) || { echo 'Migration version 0.0.0 is reserved.' >&2; exit 1; }
          echo "MIGRATION_VERSION=$source_version" >> "$GITHUB_ENV"
          echo "MIGRATION_SEQUENCE=$migration_sequence" >> "$GITHUB_ENV"

      - name: Validate exact successful migration CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          run_json="$(curl --fail --silent --show-error -L \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$EXPECTED_SOURCE_SHA" || { echo 'CI source SHA mismatch.' >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success' || { echo 'Migration CI run was not successful.' >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = '.github/workflows/battery-monitor-secure-boot-migration-ci.yml' || { echo 'Unexpected CI workflow.' >&2; exit 1; }

      - name: Download exact unsigned migration candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Battery-Monitor-Secure-Boot-Migration-CI-UNSIGNED-0.1.2
          path: /tmp/migration
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Validate promoted migration authority and bytes
        shell: bash
        run: |
          set -euo pipefail
          dir=/tmp/migration
          app="$dir/BatteryMonitor.secureboot.app.unsigned.bin"
          boot="$dir/BatteryMonitor.secureboot.bootloader.unsigned.bin"
          authority="$dir/MIGRATION_BUILD_AUTHORITY.txt"
          test -f "$app" && test -f "$boot" && test -f "$authority"
          grep -qx "migration_version=$MIGRATION_VERSION" "$authority"
          grep -qx "release_sequence=$MIGRATION_SEQUENCE" "$authority"
          grep -Fqx 'release_sequence_derivation=major*100+minor*10+patch' "$authority"
          grep -qx 'secure_boot=enabled-v2-rsa-remote-signing' "$authority"
          grep -qx 'minimum_esp32_revision=3.0-ECO3' "$authority"
          grep -qx 'flash_encryption=enabled-release-mode' "$authority"
          grep -qx 'flash_encryption_must_preexist=yes' "$authority"
          grep -qx 'normal_provisioning_default_secure_boot=unchanged-disabled' "$authority"
          grep -qx 'secure_boot_v2_unsigned_bootloader_limit=0xC000' "$authority"

          expected_app_size="$(awk -F= '$1=="unsigned_application_size"{print $2}' "$authority")"
          expected_boot_size="$(awk -F= '$1=="unsigned_bootloader_size"{print $2}' "$authority")"
          expected_app="$(awk -F= '$1=="unsigned_application_sha256"{print $2}' "$authority")"
          expected_boot="$(awk -F= '$1=="unsigned_bootloader_sha256"{print $2}' "$authority")"
          [[ "$expected_app_size" =~ ^[0-9]+$ ]] || { echo 'Invalid unsigned application size authority.' >&2; exit 1; }
          [[ "$expected_boot_size" =~ ^[0-9]+$ ]] || { echo 'Invalid unsigned bootloader size authority.' >&2; exit 1; }
          test "$(stat -c %s "$app")" -eq "$expected_app_size" || { echo 'Unsigned application size does not match CI authority.' >&2; exit 1; }
          test "$(stat -c %s "$boot")" -eq "$expected_boot_size" || { echo 'Unsigned bootloader size does not match CI authority.' >&2; exit 1; }
          (( expected_app_size <= 0x13F000 )) || { echo "Unsigned app leaves no room for Secure Boot signature sector: $expected_app_size" >&2; exit 1; }
          (( expected_boot_size <= 0xC000 )) || { echo "Unsigned bootloader exceeds classic ESP32 Secure Boot v2 48 KiB limit: $expected_boot_size" >&2; exit 1; }
          test -n "$expected_app" && test "$(sha256sum "$app" | awk '{print $1}')" = "$expected_app"
          test -n "$expected_boot" && test "$(sha256sum "$boot" | awk '{print $1}')" = "$expected_boot"

      - name: Install pinned ESP-IDF secure-signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          idf="$RUNNER_TEMP/esp-idf"
          commit='b774170ff46c393eeb5e495ea37936038d3f4f4f'
          mkdir -p "$idf"
          git -C "$idf" init
          git -C "$idf" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$idf" fetch --depth=1 origin "$commit"
          git -C "$idf" checkout --detach FETCH_HEAD
          test "$(git -C "$idf" rev-parse HEAD)" = "$commit"
          git -C "$idf" submodule update --init --recursive --depth=1
          "$idf/install.sh" esp32
          echo "IDF_PATH=$idf" >> "$GITHUB_ENV"

      - name: Secure-Boot-v2 sign and independently detached-sign migration images
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BATMON_SECURE_BOOT_V2_SIGNING_KEY_B64" || { echo 'BATMON_SECURE_BOOT_V2_SIGNING_KEY_B64 is not configured.' >&2; exit 1; }
          test -n "$BATMON_SECURE_BOOT_V2_SIGNING_KEY_PASSWORD" || { echo 'BATMON_SECURE_BOOT_V2_SIGNING_KEY_PASSWORD is not configured.' >&2; exit 1; }
          test -n "$BATMON_FIRMWARE_SIGNING_KEY_B64" || { echo 'Detached firmware signing key is not configured.' >&2; exit 1; }
          test -n "$BATMON_FIRMWARE_SIGNING_KEY_PASSWORD" || { echo 'Detached firmware signing key password is not configured.' >&2; exit 1; }

          encrypted_sb=/tmp/secure-boot-v2-key.encrypted.pem
          sbkey=/tmp/secure-boot-v2-key.pem
          detached=/tmp/batmon-detached-key.pem
          trap 'rm -f "$encrypted_sb" "$sbkey" "$detached"' EXIT
          printf '%s' "$BATMON_SECURE_BOOT_V2_SIGNING_KEY_B64" | base64 --decode > "$encrypted_sb"
          chmod 600 "$encrypted_sb"
          openssl pkey -in "$encrypted_sb" -passin env:BATMON_SECURE_BOOT_V2_SIGNING_KEY_PASSWORD -out "$sbkey"
          chmod 600 "$sbkey"
          openssl pkey -in "$sbkey" -text -noout | grep -Fq 'Private-Key: (3072 bit' || { echo 'Secure Boot v2 key must be RSA-3072.' >&2; exit 1; }
          sb_fingerprint="$(openssl pkey -in "$sbkey" -pubout -outform DER | sha256sum | awk '{print $1}')"

          printf '%s' "$BATMON_FIRMWARE_SIGNING_KEY_B64" | base64 --decode > "$detached"
          detached_fingerprint="$(openssl pkey -in "$detached" -passin env:BATMON_FIRMWARE_SIGNING_KEY_PASSWORD -pubout -outform DER | sha256sum | awk '{print $1}')"
          test "$detached_fingerprint" = "$EXPECTED_DETACHED_KEY_FINGERPRINT" || { echo "Detached signing key mismatch: $detached_fingerprint" >&2; exit 1; }

          . "$IDF_PATH/export.sh"
          espsecure="$IDF_PATH/components/esptool_py/esptool/espsecure.py"
          dir=/tmp/migration
          unsigned_app="$dir/BatteryMonitor.secureboot.app.unsigned.bin"
          unsigned_boot="$dir/BatteryMonitor.secureboot.bootloader.unsigned.bin"
          app="$dir/BatteryMonitor.secureboot.app.bin"
          boot="$dir/BatteryMonitor.secureboot.bootloader.bin"
          unsigned_app_size="$(stat -c %s "$unsigned_app")"
          unsigned_boot_size="$(stat -c %s "$unsigned_boot")"

          python "$espsecure" sign_data --version 2 --keyfile "$sbkey" --output "$app" "$unsigned_app"
          python "$espsecure" sign_data --version 2 --keyfile "$sbkey" --output "$boot" "$unsigned_boot"
          python "$espsecure" verify_signature --version 2 --keyfile "$sbkey" "$app"
          python "$espsecure" verify_signature --version 2 --keyfile "$sbkey" "$boot"

          app_size="$(stat -c %s "$app")"
          boot_size="$(stat -c %s "$boot")"
          (( app_size == unsigned_app_size + 0x1000 )) || { echo "Unexpected Secure Boot app signature size growth: unsigned=$unsigned_app_size signed=$app_size" >&2; exit 1; }
          (( boot_size == unsigned_boot_size + 0x1000 )) || { echo "Unexpected Secure Boot bootloader signature size growth: unsigned=$unsigned_boot_size signed=$boot_size" >&2; exit 1; }
          (( app_size <= 0x140000 )) || { echo "Signed app exceeds deployed OTA slot: $app_size" >&2; exit 1; }
          (( boot_size <= 0xD000 )) || { echo "Signed bootloader exceeds classic ESP32 Secure Boot v2 48 KiB + 4 KiB signature envelope: $boot_size" >&2; exit 1; }
          (( boot_size <= 0xE000 )) || { echo "Signed bootloader exceeds primary bootloader region: $boot_size" >&2; exit 1; }
          (( boot_size <= 0x10000 )) || { echo "Signed bootloader exceeds temporary coredump staging partition: $boot_size" >&2; exit 1; }

          for image in "$app" "$boot"; do
            openssl dgst -sha256 \
              -sign "$detached" \
              -passin env:BATMON_FIRMWARE_SIGNING_KEY_PASSWORD \
              -sigopt rsa_padding_mode:pss \
              -sigopt rsa_pss_saltlen:-1 \
              -out "$image.sig" \
              "$image"
            test "$(wc -c < "$image.sig")" -eq 384
            openssl dgst -sha256 \
              -verify battery-monitor/signing/battery_monitor_secureboot_rsa3072_public.pem \
              -signature "$image.sig" \
              -sigopt rsa_padding_mode:pss \
              -sigopt rsa_pss_saltlen:-1 \
              "$image"
          done

          app_sha="$(sha256sum "$app" | awk '{print $1}')"
          boot_sha="$(sha256sum "$boot" | awk '{print $1}')"
          cat > "$dir/MIGRATION_RELEASE.txt" <<EOF
          schema=BATMON_SECURE_BOOT_MIGRATION_RELEASE_V1
          source_sha=${{ inputs.source_sha }}
          promoted_ci_run_id=${{ inputs.ci_run_id }}
          version=$MIGRATION_VERSION
          release_sequence=$MIGRATION_SEQUENCE
          release_sequence_derivation=major*100+minor*10+patch
          migration_scope=existing-release-encrypted-ECO3-plus-units-only
          minimum_esp32_revision=3.0-ECO3
          secure_boot=ESP32-Secure-Boot-v2-RSA-PSS
          secure_boot_public_key_spki_sha256=$sb_fingerprint
          secondary_detached_authorization=RSA-3072-PSS-SHA256
          detached_public_key_spki_sha256=$EXPECTED_DETACHED_KEY_FINGERPRINT
          flash_encryption_required=enabled-release-mode
          flash_encryption_must_preexist=yes
          primary_bootloader_offset=0x1000
          primary_bootloader_region_size=0xE000
          secure_boot_v2_unsigned_bootloader_limit=0xC000
          secure_boot_v2_signed_bootloader_limit=0xD000
          bootloader_staging_partition=coredump@0x3F0000+0x10000
          signed_application_size=$app_size
          signed_bootloader_size=$boot_size
          signed_application_sha256=$app_sha
          signed_bootloader_sha256=$boot_sha
          final_bootloader_copy_power_loss_risk=unrecoverable-device-possible
          normal_provisioning_default_secure_boot=unchanged-disabled
          EOF

          rm -f "$unsigned_app" "$unsigned_boot"

      - name: Upload protected signed migration bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Battery-Monitor-Secure-Boot-Migration-SIGNED-${{ inputs.version }}
          path: /tmp/migration
