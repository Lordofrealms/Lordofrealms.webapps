name: Pad Grade v1.1.0 staging prep

on:
  push:
    branches: [pad-grade-dev-v110-staged-heat]
    paths:
      - '.github/workflows/pad-grade-v110-prep.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply v1.1.0 staged heat patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v110-staged-heat
          fetch-depth: 0
      - name: Apply v1.1.0 staged heat policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # Regular heatmap: 99 + 297 immediately; 891 only after 297 completes.
          p='pad-grade/v063-dev.js'
          replace_once(p,
              'that dynamically-created image URLs were unreliable here. Four complete tiers (33, 99, 297, 891) now start concurrently.\n * Each completed higher tier atomically replaces the previous whole raster.',
              'that dynamically-created image URLs were unreliable here. The 99 and 297 tiers start concurrently; the 891 final tier starts only after 297 completes.\n * Each completed higher tier atomically replaces the previous whole raster.')
          replace_once(p,'if(window.__padGradeHeatmapEngineV109)return;\n  window.__padGradeHeatmapEngineV109=true;',
                         'if(window.__padGradeHeatmapEngineV110)return;\n  window.__padGradeHeatmapEngineV110=true;')
          replace_once(p,
              'const TIERS=Object.freeze([33,99,297,891]);\n  const LOW_TIER=33;\n  const HIGH_TIER=891;',
              'const TIERS=Object.freeze([99,297,891]);\n  const INITIAL_TIERS=Object.freeze([99,297]);\n  const LOW_TIER=99;\n  const HIGH_TIER=891;')
          replace_once(p,
              'cleanup();\n      if(gen!==generation||currentSurfaceKey!==key)return;\n      if(displayedKey===key&&displayedTier>=tier)',
              "cleanup();\n      if(gen!==generation||currentSurfaceKey!==key)return;\n      if(tier===297&&!activeJobs.has(HIGH_TIER)&&!workers.has(HIGH_TIER)){\n        try{window.PadGradeDiag?.mark?.('heatmap.regular-final-tier-starting',{afterTier:tier,tier:HIGH_TIER,generation:gen});}catch(e){}\n        buildRaster(HIGH_TIER,points,key,gen);\n      }\n      if(displayedKey===key&&displayedTier>=tier)")
          replace_once(p,
              'for(const tier of TIERS)buildRaster(tier,points,key,gen);\n    try{window.PadGradeDiag?.mark?.(\'heatmap.regular-generation-started\',{tiers:TIERS.slice(),points:points.length,generation:gen});}catch(e){}',
              "for(const tier of INITIAL_TIERS)buildRaster(tier,points,key,gen);\n    try{window.PadGradeDiag?.mark?.('heatmap.regular-generation-started',{tiers:TIERS.slice(),initialTiers:INITIAL_TIERS.slice(),deferredTier:HIGH_TIER,points:points.length,generation:gen});}catch(e){}")

          # Project Comparison uses the identical staged policy, independently.
          p='pad-grade/v107-compare-fast.js'
          replace_once(p,'/* Pad Grade v1.0.8 DEV — indexed progressive project comparison. */','/* Pad Grade v1.1.0 DEV — indexed staged progressive project comparison. */')
          replace_once(p,
              "const VERSION='v1.0.9 DEV',PICK='projectCompareDlgV107',OVER='pgCompareOverlay',TIERS=Object.freeze([33,99,297,891]),LOW=33,HIGH=891,WORKER='heatmap-raster-worker-v078.js?v=20260830-4';",
              "const VERSION='v1.1.0 DEV',PICK='projectCompareDlgV107',OVER='pgCompareOverlay',TIERS=Object.freeze([99,297,891]),INITIAL_TIERS=Object.freeze([99,297]),LOW=99,HIGH=891,WORKER='heatmap-raster-worker-v078.js?v=20260830-4';")
          replace_once(p,
              'window.__padGradeCompareFastV107=true;window.__padGradeCompareFastV108=true;window.__padGradeCompareProgressiveV109=true;',
              'window.__padGradeCompareFastV107=true;window.__padGradeCompareFastV108=true;window.__padGradeCompareProgressiveV109=true;window.__padGradeCompareProgressiveV110=true;')
          replace_once(p,
              "cleanup();if(s!==serial)return;if(t<=displayedTier)",
              "cleanup();if(s!==serial)return;if(t===297&&!workers.has(HIGH)&&!heatJobs.has(HIGH)){diag()?.mark?.('compare.heat-final-tier-starting',{afterTier:t,tier:HIGH,generation:s});startTier(HIGH,s);}if(t<=displayedTier)")
          replace_once(p,
              "function startHeat(s){if(s!==serial||!S?.comparison)return;for(const t of TIERS)startTier(t,s);diag()?.mark?.('compare.heat-generation-started',{tiers:TIERS.slice(),points:S.comparison.points.length,generation:s});}",
              "function startHeat(s){if(s!==serial||!S?.comparison)return;for(const t of INITIAL_TIERS)startTier(t,s);diag()?.mark?.('compare.heat-generation-started',{tiers:TIERS.slice(),initialTiers:INITIAL_TIERS.slice(),deferredTier:HIGH,points:S.comparison.points.length,generation:s});}")

          replace_once('pad-grade/index.html','<title>Pad Grade Mapper v1.0.9 DEV</title>','<title>Pad Grade Mapper v1.1.0 DEV</title>')
          replace_once('pad-grade-android/app/build.gradle.kts','versionCode = 81\n        versionName = "1.0.9"','versionCode = 82\n        versionName = "1.1.0"')

          entry='''## v1.1.0 — development build

### Changed
- Removed the **33-tier** heat-map pass. Device diagnostics showed that it produced a very coarse approximately 28×33 raster only about 0.8–1.6 seconds before the substantially better 99-tier image, while adding another worker during startup and map setup.
- Normal and Project Comparison heat maps now start **99 and 297 concurrently**. The **891 final tier is deliberately deferred until the 297 worker completes**, so the expensive approximately 668k-cell final raster does not compete with the two tiers that establish the useful early display.
- Atomic whole-raster promotion remains monotonic: 99 can be replaced by 297, and 297 by 891, but a later lower tier can never downgrade a higher-resolution surface already on screen.
- The grid-aware quality floor of **3 raster pixels between adjacent survey points** remains in place. On the normal 9×9, 64×76 ft pad, the requested rasters remain approximately 83×99, 250×297, and 750×891.
- Regular and comparison heat maps remain independent. Opening Project Comparison does **not** cancel, defer, or globally throttle a regular-map heat calculation already in progress.
- Android DEV package is **version 1.1.0 / build 82**. Schema 6, schema-6 → schema-5 rollback, project indexing/recovery protections, and the fixed 15% GPS-map hitbox behavior are unchanged.

### Diagnostics / DEV verification
- Heat diagnostics now identify the staged policy in each generation (`initialTiers: [99,297]`, `deferredTier: 891`) and log an explicit final-tier-start event when 297 completes.
- Verify that each new surface posts only 99 and 297 initially, that 891 is not posted until the matching 297 worker-complete event, and that no tier-33 work appears.
- Compare time-to-visible for 99 and 297 against v1.0.9. The purpose of this build is to reduce early CPU contention while retaining the 891 final-quality surface.

'''
          for path in ('pad-grade/CHANGELOG.md','pad-grade-android/CHANGELOG.md'):
              p=Path(path); s=p.read_text()
              if '## v1.1.0 — development build' in s: continue
              marker='## v1.0.9 — development build'
              if marker not in s: raise SystemExit(f'{path}: changelog insertion marker missing')
              p.write_text(s.replace(marker,entry+marker,1))

          # Turn the old v1.0.9 gate into a version-independent carry-forward gate.
          Path('.github/workflows/pad-grade-v109-progressive-heat.yml').write_text('''name: Pad Grade Progressive Heat Carry-Forward

on:
  pull_request:
    branches: [pad-grade-dev, main]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-v109-progressive-heat.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate retained progressive-heat architecture
        run: |
          node --check pad-grade/v062-dev.js
          node --check pad-grade/v063-dev.js
          node --check pad-grade/v107-compare-fast.js
          ! grep -F '(function loadPadGrade063(){' pad-grade/v062-dev.js
          test "$(grep -c 'src="v063-dev.js' pad-grade/index.html)" -eq 1
          grep -F '(cols-1)*3+1' pad-grade/v063-dev.js
          grep -F '*3+1,minY=' pad-grade/v107-compare-fast.js
          grep -F "reason:'higher-tier-already-visible'" pad-grade/v063-dev.js
          grep -F "reason:'higher-tier-already-visible'" pad-grade/v107-compare-fast.js
          grep -F 'progressiveTiers:TIERS.slice(),monotonic:true' pad-grade/v063-dev.js
          grep -F 'heatmap.regular-worker-complete' pad-grade/v063-dev.js
          grep -F 'compare.heat-worker-complete' pad-grade/v107-compare-fast.js
          grep -F 'const HITBOX_PADDING_PCT=15;' pad-grade/v106-map-hitbox.js
          grep -F 'CURRENT_SCHEMA=6,ROLLBACK_SCHEMA=5' pad-grade/project-format-v107.js
''')

          Path('pad-grade/v110-staged-heat-selftest.js').write_text('''const fs=require('fs'),assert=require('assert');
const regular=fs.readFileSync('pad-grade/v063-dev.js','utf8');
const compare=fs.readFileSync('pad-grade/v107-compare-fast.js','utf8');
const gate=fs.readFileSync('pad-grade/v062-dev.js','utf8');
assert(regular.includes('TIERS=Object.freeze([99,297,891])'));
assert(regular.includes('INITIAL_TIERS=Object.freeze([99,297])'));
assert(compare.includes('TIERS=Object.freeze([99,297,891])'));
assert(compare.includes('INITIAL_TIERS=Object.freeze([99,297])'));
assert(!regular.includes('TIERS=Object.freeze([33,'));
assert(!compare.includes('TIERS=Object.freeze([33,'));
assert(regular.includes('window.__padGradeHeatmapEngineV110'));
assert(!gate.includes('(function loadPadGrade063(){'));
assert(regular.includes('for(const tier of INITIAL_TIERS)buildRaster'));
assert(compare.includes('for(const t of INITIAL_TIERS)startTier'));
assert(regular.includes("tier===297&&!activeJobs.has(HIGH_TIER)&&!workers.has(HIGH_TIER)"));
assert(regular.includes('buildRaster(HIGH_TIER,points,key,gen)'));
assert(compare.includes("t===297&&!workers.has(HIGH)&&!heatJobs.has(HIGH)"));
assert(compare.includes('startTier(HIGH,s)'));
assert(regular.includes("heatmap.regular-final-tier-starting"));
assert(compare.includes("compare.heat-final-tier-starting"));
assert(regular.includes("reason:'higher-tier-already-visible'"));
assert(compare.includes("reason:'higher-tier-already-visible'"));
const width=64,length=76,cols=9,rows=9,longest=76;
const res=t=>({nx:Math.max((cols-1)*3+1,Math.round(t*width/longest)),ny:Math.max((rows-1)*3+1,Math.round(t*length/longest))});
assert.deepStrictEqual(res(99),{nx:83,ny:99});
assert.deepStrictEqual(res(297),{nx:250,ny:297});
assert.deepStrictEqual(res(891),{nx:750,ny:891});
console.log('v1.1.0 staged heat self-test passed');
''')

          Path('.github/workflows/pad-grade-v110-staged-heat.yml').write_text('''name: Pad Grade v1.1.0 Staged Heat

on:
  pull_request:
    branches: [pad-grade-dev, main]
    paths:
      - 'pad-grade/**'
      - 'pad-grade-android/**'
      - '.github/workflows/pad-grade-v110-staged-heat.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources and staged heat self-test
        run: |
          node --check pad-grade/v063-dev.js
          node --check pad-grade/v107-compare-fast.js
          node --check pad-grade/v110-staged-heat-selftest.js
          node pad-grade/v110-staged-heat-selftest.js
      - name: Verify exact 99/297 then 891 policy
        run: |
          grep -F 'TIERS=Object.freeze([99,297,891])' pad-grade/v063-dev.js
          grep -F 'INITIAL_TIERS=Object.freeze([99,297])' pad-grade/v063-dev.js
          grep -F 'TIERS=Object.freeze([99,297,891])' pad-grade/v107-compare-fast.js
          grep -F 'INITIAL_TIERS=Object.freeze([99,297])' pad-grade/v107-compare-fast.js
          ! grep -F 'TIERS=Object.freeze([33,' pad-grade/v063-dev.js
          ! grep -F 'TIERS=Object.freeze([33,' pad-grade/v107-compare-fast.js
          grep -F 'for(const tier of INITIAL_TIERS)buildRaster' pad-grade/v063-dev.js
          grep -F 'buildRaster(HIGH_TIER,points,key,gen)' pad-grade/v063-dev.js
          grep -F 'for(const t of INITIAL_TIERS)startTier' pad-grade/v107-compare-fast.js
          grep -F 'startTier(HIGH,s)' pad-grade/v107-compare-fast.js
      - name: Verify staging diagnostics and monotonic atomic promotion
        run: |
          grep -F 'heatmap.regular-final-tier-starting' pad-grade/v063-dev.js
          grep -F 'compare.heat-final-tier-starting' pad-grade/v107-compare-fast.js
          grep -F 'initialTiers:INITIAL_TIERS.slice(),deferredTier:HIGH_TIER' pad-grade/v063-dev.js
          grep -F 'initialTiers:INITIAL_TIERS.slice(),deferredTier:HIGH' pad-grade/v107-compare-fast.js
          grep -F "reason:'higher-tier-already-visible'" pad-grade/v063-dev.js
          grep -F "reason:'higher-tier-already-visible'" pad-grade/v107-compare-fast.js
      - name: Verify v1.1.0 DEV metadata and safety carry-forward
        run: |
          grep -F 'versionCode = 82' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.1.0"' pad-grade-android/app/build.gradle.kts
          grep -F '<title>Pad Grade Mapper v1.1.0 DEV</title>' pad-grade/index.html
          grep -F '## v1.1.0 — development build' pad-grade/CHANGELOG.md
          grep -F 'const HITBOX_PADDING_PCT=15;' pad-grade/v106-map-hitbox.js
          grep -F 'CURRENT_SCHEMA=6,ROLLBACK_SCHEMA=5' pad-grade/project-format-v107.js
''')
          PY

          rm .github/workflows/pad-grade-v110-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply v1.1.0 staged heat patch'
          git push origin HEAD:pad-grade-dev-v110-staged-heat
