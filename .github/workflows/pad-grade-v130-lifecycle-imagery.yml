name: Pad Grade v1.3.0 Lifecycle + Imagery Diagnostics

on:
  push:
    paths:
      - 'pad-grade/v130-dev.js'
      - 'pad-grade/v130-base-capture.js'
      - 'pad-grade/v130-lifecycle-imagery-selftest.js'
      - 'pad-grade/index.html'
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-v130-lifecycle-imagery.yml'
  pull_request:
    branches: [pad-grade-dev]
    paths:
      - 'pad-grade/v130-dev.js'
      - 'pad-grade/v130-base-capture.js'
      - 'pad-grade/v130-lifecycle-imagery-selftest.js'
      - 'pad-grade/index.html'
      - 'pad-grade/RELEASE_NOTES.md'
      - 'pad-grade-android/app/build.gradle.kts'
      - '.github/workflows/pad-grade-v130-lifecycle-imagery.yml'

jobs:
  lifecycle-imagery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate v1.3.0 scripts
        run: |
          node --check pad-grade/v130-base-capture.js
          node --check pad-grade/v130-dev.js
          node --check pad-grade/v130-lifecycle-imagery-selftest.js

      - name: Prove authoritative mutation, zero-worker cache hit, render confirmation, and imagery diagnostics
        run: node pad-grade/v130-lifecycle-imagery-selftest.js

      - name: Preserve heat lifecycle and flickerless presentation boundaries
        run: |
          node pad-grade/v129-cache-return-selftest.js
          node pad-grade/v128-mutation-retire-selftest.js
          node pad-grade/v127-lifecycle-selftest.js
          node pad-grade/v122-canvas-handoff-selftest.js
          node pad-grade/v126-generation-cancel-selftest.js
          grep -F "PROTECTED v1.2.2 PRESENTATION CONTRACT" pad-grade/v130-dev.js
          grep -F "protectedV122PresenterUnchanged:true" pad-grade/v130-dev.js
          grep -F "exact891BeforeWorkerCreation:true" pad-grade/v130-dev.js
          grep -F "legacy900msRetryHasNoRaster:true" pad-grade/v130-dev.js
          grep -F "heatmap.v130-cache-render-confirmed" pad-grade/v130-dev.js

      - name: Verify v1.3.0 version and load order
        run: |
          grep -F 'versionCode = 102' pad-grade-android/app/build.gradle.kts
          grep -F 'versionName = "1.3.0"' pad-grade-android/app/build.gradle.kts
          grep -F 'src="v130-base-capture.js?v=20260901-1"' pad-grade/index.html
          grep -F 'src="v130-dev.js?v=20260901-1"' pad-grade/index.html
          grep -F '<title>Pad Grade Mapper v1.3.0 DEV</title>' pad-grade/index.html
          ! grep -E '1\.2\.10|v1210' pad-grade/v130-dev.js pad-grade/v130-base-capture.js pad-grade/index.html pad-grade-android/app/build.gradle.kts

      - name: Verify imagery diagnostics are diagnostic-only
        run: |
          grep -F "providersUnchanged:true" pad-grade/v130-dev.js
          grep -F "recoveryBehaviorUnchanged:true" pad-grade/v130-dev.js
          grep -F "independentHighResProbe:true" pad-grade/v130-dev.js
          grep -F "const CACHED_TILE_URL='https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}'" pad-grade/map.js
          grep -F "USGSNAIPPlus/ImageServer/exportImage" pad-grade/map.js
