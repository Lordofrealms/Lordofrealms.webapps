name: Pad Grade v1.1.10 Patch Temp

on:
  push:
    branches:
      - pad-grade-dev-v120-maplibre516-image-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v120-maplibre516-image-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v1.1.10 heat fix
        run: python v120_patch.py
      - name: Validate generated files
        run: |
          node --check pad-grade/v120-dev.js
          node pad-grade/v120-heat-fix-selftest.js
          node pad-grade/v120-runtime-selftest.js
          node pad-grade/v119-heat-cutover-selftest.js
          git diff --check
      - name: Commit generated fix
        run: |
          rm v120_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Build Pad Grade v1.1.10 MapLibre 5.16 heat fix'
          git push origin HEAD:pad-grade-dev-v120-maplibre516-image-fix
