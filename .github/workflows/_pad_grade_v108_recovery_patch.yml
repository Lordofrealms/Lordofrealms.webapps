name: Pad Grade v1.0.8 recovery hardening

on:
  push:
    branches:
      - pad-grade-dev-v108-recovery-compare-diag

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v108-recovery]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v108-recovery-compare-diag
          fetch-depth: 0
      - name: Force durable active-project load during recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pad-grade/v107-index-reconcile.js')
          t=p.read_text()

          old='async function loadProject(id){'
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,'async function loadProject(id,forceDurable=false){',1)

          old="    if(local&&!e?.localBodyStale)return fmt.normalizeProject(local,null);"
          new="    if(local&&!forceDurable&&!e?.localBodyStale)return fmt.normalizeProject(local,null);"
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,new,1)

          old="    if(local&&e.localBodyStale)diag()?.mark?.('project.local-body-stale',{projectId:id,filename:e.filename});"
          new="    if(local&&e?.localBodyStale)diag()?.mark?.('project.local-body-stale',{projectId:id,filename:e.filename});\n    if(forceDurable)diag()?.mark?.('recovery.active-durable-force-load',{projectId:id,filename:e.filename});"
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,new,1)

          old="      const desired=settings?.lastProjectId||localStorage.getItem(ACTIVE_KEY)||null;await readIndex();let restored=null;\n      if(desired){restored=getLocal(desired);if(!restored){let entry=findEntry(desired);"
          new="      const desired=settings?.lastProjectId||localStorage.getItem(ACTIVE_KEY)||null;await readIndex();let restored=null;\n      const forceDurableActive=!!desired&&(recoveryPending()||criticalRecoveryActive());\n      if(desired){restored=forceDurableActive?null:getLocal(desired);if(forceDurableActive)diag()?.mark?.('recovery.active-durable-force-request',{projectId:desired});if(!restored){let entry=findEntry(desired);"
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,new,1)

          old='if(entry)restored=await loadProject(desired);}'
          new='if(entry)restored=await loadProject(desired,forceDurableActive);}'
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,new,1)

          t=t.replace("diag()?.mark?.('index.controller-installed',{version:'1.0.7'","diag()?.mark?.('index.controller-installed',{version:'1.0.8'",1)
          p.write_text(t)

          extra='- During durable first-install/folder recovery, the selected active project body is force-read from its authoritative `.padgrade` file once instead of trusting a preexisting local cached body. This is a second defense against stale/partial local state surviving the recovery reload.\n'
          anchor='- The comparison picker now uses an already-verified in-memory durable catalog without rereading `Pad-Grade-Project-Index.pgindex` or touching SAF. Folder select/index/refresh events explicitly dirty that cache so externally copied or replaced files still force a real reconciliation before the catalog is trusted again.\n'
          for name in ['pad-grade/CHANGELOG.md','pad-grade-android/CHANGELOG.md']:
              q=Path(name);s=q.read_text();assert anchor in s;s=s.replace(anchor,anchor+extra,1);q.write_text(s)

          # Source-contract checks.
          s=p.read_text()
          for needle in ['loadProject(id,forceDurable=false)','!forceDurable&&!e?.localBodyStale','forceDurableActive','loadProject(desired,forceDurableActive)','recovery.active-durable-force-load',"version:'1.0.8'"]:
              assert needle in s, needle
          PY
          node --check pad-grade/v107-index-reconcile.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pad-grade/v107-index-reconcile.js pad-grade/CHANGELOG.md pad-grade-android/CHANGELOG.md
          git commit -m "Harden v1.0.8 active project recovery [v108-recovery]"
          git push origin HEAD:pad-grade-dev-v108-recovery-compare-diag
