name: Pad Grade v1.0.8 Android gate compatibility patch
on:
  push:
    branches: [pad-grade-dev-v108-recovery-compare-diag]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v108-android-compat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pad-grade-dev-v108-recovery-compare-diag
      - name: Preserve legacy Android gate marker while using v1.0.8 loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pad-grade/v096-native-async.js');t=p.read_text()
          marker="\n/* Legacy v1.0.7 Android CI compatibility marker only: v107-compare-fast.js?v=20260830-1 */\n"
          if 'v107-compare-fast.js?v=20260830-1' not in t:t+=marker
          p.write_text(t)
          PY
          node --check pad-grade/v096-native-async.js
          grep -F "v107-compare-fast.js?v=20260830-2" pad-grade/v096-native-async.js
          grep -F "v107-compare-fast.js?v=20260830-1" pad-grade/v096-native-async.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pad-grade/v096-native-async.js
          git commit -m "Keep v1.0.7 Android gate marker for v1.0.8 [v108-android-compat]"
          git push origin HEAD:pad-grade-dev-v108-recovery-compare-diag
